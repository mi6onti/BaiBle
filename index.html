/* ── Storage ─────────────────────────────────────────────────────────── */
async function loadJSON(key, fallback) {
  if (USE_LOCAL) { try { const r=localStorage.getItem("aperture:"+key); return r?JSON.parse(r):fallback; } catch{return fallback;} }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`,
      {headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    return rows.length>0 ? rows[0].value : fallback;
  } catch { return fallback; }
}
async function saveJSON(key, value) {
  if (USE_LOCAL) { try{localStorage.setItem("aperture:"+key,JSON.stringify(value));return{ok:true};}catch(e){return{ok:false,detail:e.message};} }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?on_conflict=key`,{
      method:"POST",
      headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=representation"},
      body:JSON.stringify({key,value})
    });
    if (!res.ok){const b=await res.text();return{ok:false,detail:`${res.status}: ${b.slice(0,200)}`};}
    return {ok:true};
  } catch(e){return{ok:false,detail:`${e.name}: ${e.message}`};}
}

/* ── Helpers ─────────────────────────────────────────────────────────── */
function slugify(s){const b=(s||"").toLowerCase().trim().replace(/[^a-z0-9а-я]+/gi,"-").replace(/(^-|-$)/g,"").slice(0,40);return b||"x"+Math.random().toString(36).slice(2,7);}
function topPreferred(m,fb){const e=Object.entries(m||{});if(!e.length)return fb;e.sort((a,b)=>b[1]-a[1]);return e[0][1]>0?e[0][0]:fb;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ── Claude API ──────────────────────────────────────────────────────── */
async function callClaude(user, maxTokens=600, attempt=0) {
  let res;
  try {
    res = await fetch(CLAUDE_PROXY,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_KEY}`},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:maxTokens,messages:[{role:"user",content:`${JSON_SYS}\n\n${user}`}]})});
  } catch(e) {
    if(attempt<3){await sleep(700*(attempt+1));return callClaude(user,maxTokens,attempt+1);}
    throw new Error(`[fetch] ${e.message}`);
  }
  if(res.status===429&&attempt<3){await sleep(1500*(attempt+1));return callClaude(user,maxTokens,attempt+1);}
  let data;
  try{data=await res.json();}catch(e){
    if(attempt<3){await sleep(700*(attempt+1));return callClaude(user,maxTokens,attempt+1);}
    throw new Error(`[parse] ${e.message}`);
  }
  if(!res.ok) throw new Error(`[http] ${res.status}: ${JSON.stringify(data).slice(0,150)}`);
  if(!data?.content) throw new Error(`[shape] ${JSON.stringify(data).slice(0,100)}`);
  const text=data.content.map(b=>b.text||"").join("\n");
  let clean=text.replace(/```json/gi,"").replace(/```/g,"").trim();
  const fi=clean.indexOf("{"),la=clean.lastIndexOf("}");
  if(fi!==-1&&la>fi)clean=clean.slice(fi,la+1);
  try{return JSON.parse(clean);}catch(e){throw new Error(`[json] ${e.message} | raw=${text.slice(0,100)}`);}
}

async function genAbstraction(topic, sub, subsub, subLevel, unitCount) {
  const totalBudget = wb(subLevel||3, 0.32);
  const perUnit = Math.max(60, Math.round(totalBudget/(unitCount||3)));
  const perExplanation = Math.max(18, Math.round(perUnit/4)); // budget the unit across its 5 shown explanations, not per-explanation
  const lo=perExplanation, hi=Math.round(perExplanation*1.4);
  const levelDescs = LEVELS.map(m=>`Level ${m.level} ("${m.label}", ${m.hint})`).join("; ");
  const raw = await callClaudeRaw(
    `Topic: "${topic}" > "${sub}" > "${subsub}".
Write 5 explanations of this, one for each level below, EACH ${lo}-${hi} words:
${levelDescs}
Any example or analogy you use must fit strictly within the exact context/scenario given above — never substitute a different generic scenario. Each level should be genuinely distinct in register/depth from the others, not a reworded repeat.
Write all 5 in the SAME language as the topic chain above (detect it and match exactly).
Never use the " character inside the text.
Output EXACTLY in this format, nothing before the first marker or after the last one, no extra commentary:
###L1### level 1 text ###L2### level 2 text ###L3### level 3 text ###L4### level 4 text ###L5### level 5 text ###END###`,
    Math.min(3800, 400+hi*5*3)
  );
  const fields = extractSequentialFields(raw, ["L1","L2","L3","L4","L5"]);
  return LEVELS.map(m=>({level:m.level, text:fields[`L${m.level}`]||""}));
}

async function genLevelCheck(topic, hierarchy, prefs, nodeDataMap) {
  const solidUnits=[],confused=[],improveUnits=[],ignoredUnits=[];
  let lowLevelSum=0, lowLevelCount=0;

  // build full unit list from hierarchy (SLUGIFIED to match nodeDataMap keys) to detect never-opened units
  const allUnitKeys=[];
  for(const sub of hierarchy){
    const list = getSubsubList(sub) || [];
    for(const subsub of list){
      const name=subName(subsub);
      allUnitKeys.push({key:`${slugify(sub.name)}/${slugify(name)}`, label:`${sub.name} › ${name}`});
    }
  }

  for(const [key,nd] of Object.entries(nodeDataMap)){
    const unit=key.split("/").slice(1).join(" › ");
    const tunedLevels = nd.tunedAbstraction||[];
    const hasAnyRating = tunedLevels.length>0 || !!nd.tunedBlendKey;
    if(nd.unitConfused) confused.push(unit);
    if(tunedLevels.length>0 && !nd.unitConfused){
      const maxLevel = Math.max(...tunedLevels);
      if(maxLevel<=2){ improveUnits.push(unit); lowLevelSum+=maxLevel; lowLevelCount++; }
      else { solidUnits.push(unit); } // level 3+ counts as adequately/solidly understood
    }
    // opened but never rated and never marked confused = disengaged
    if(!hasAnyRating && !nd.unitConfused) ignoredUnits.push(unit);
  }
  // units never even opened also count as disengaged (bug fix: match slugified keys)
  const openedRelKeys = new Set(Object.keys(nodeDataMap).map(k=>k.split("/").slice(1).join("/")));
  for(const u of allUnitKeys){
    if(!openedRelKeys.has(u.key)) ignoredUnits.push(u.label);
  }

  const avgLowLevel = lowLevelCount>0 ? Math.round(lowLevelSum/lowLevelCount) : null;
  const topLvl=LEVELS.find(l=>l.level===Number(topPreferred(prefs.abstraction,null)))?.label;
  const raw=await callClaudeRaw(
    `Learner studying "${topic}". Subtopics: ${hierarchy.map(s=>s.name).join(", ")}.
Understood adequately or solidly (level 3+ explanations liked — "Mechanics", "Definition", or "Depth"): ${solidUnits.join(", ")||"none yet"}.
Marked as completely unclear: ${confused.join(", ")||"none"}.
Understood only at a shallow level (only liked "Analogy" or "Example" explanations, levels 1-2 — this is INSUFFICIENT depth, not real command of the topic): ${improveUnits.join(", ")||"none"}.
Never engaged with — no level rated, no "did not understand" mark, not opened (likely low interest, not a knowledge gap): ${ignoredUnits.join(", ")||"none"}.
Preferred explanation level overall: "${topLvl||"unknown"}".
Write in the SAME language as the topic above (detect it and match exactly). Use an OBJECTIVE, calibrated, non-flattering tone throughout — this is a factual assessment, not encouragement. Do not use inflated praise language (avoid phrases like "solid foundation", "great grasp", "well done") for anything below level 3. Be precise about what each level of understanding actually means: level 1-2 (analogy/example only) = superficial, not yet real understanding; level 3 (mechanics) = adequate, functional understanding; level 4-5 (definition/depth) = solid, strong command.
Output EXACTLY five sections using these markers, nothing before the first marker or after the last one, no extra commentary:
###KNOWS### (80-120 words) — objectively state what is adequately or solidly understood (from the level 3+ list only); if that list is empty, say plainly that nothing has reached an adequate depth yet, without softening it
###IMPROVE### (60-100 words) — ONLY about the shallow-understanding units listed above: name them and state plainly that only surface-level analogy/example understanding exists, then explain what deeper understanding is still missing for each; if empty, say there's nothing at this shallow tier
###MISSING### (100-140 words) — what's missing entirely, including confused units and missing foundational knowledge
###IGNORED### (50-90 words) — about the never-engaged units listed above: note plainly these appear low-interest rather than a knowledge gap, and future plans will deprioritize similar content; if empty, say everything has been engaged with
###NEXT### (40-70 words) — ONE concrete next step focused on making unclear material actually click and reinforcing what's already understood. Prioritize in this order: (a) if there are confused units, suggest revisiting one of them with a genuinely different explanation approach (a different angle, simpler language, or filling a likely missing prerequisite concept) — do NOT suggest simply moving to new/harder material; (b) if no confused units but shallow-understanding units exist, suggest deepening ONE of those at a similar or only slightly higher level, not a big jump; (c) only if everything so far is solid, suggest a genuinely new next topic. The goal is comprehension and consolidation, never difficulty escalation for its own sake.
###END###`,
    1500
  );
  const fields = extractSequentialFields(raw, ["KNOWS","IMPROVE","MISSING","IGNORED","NEXT"]);
  return {
    knows: fields.KNOWS, improve: fields.IMPROVE, missing: fields.MISSING, ignored: fields.IGNORED, next: fields.NEXT,
    _improveUnits: improveUnits, _avgLowLevel: avgLowLevel, _ignoredUnits: ignoredUnits
  };
}

// raw text call (no JSON) — safer for long prose that may contain quotes/punctuation
async function callClaudeRaw(user, maxTokens=1500, attempt=0) {
  let res;
  try {
    res = await fetch(CLAUDE_PROXY,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_KEY}`},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:maxTokens,messages:[{role:"user",content:user}]})});
  } catch(e) {
    if(attempt<3){await sleep(700*(attempt+1));return callClaudeRaw(user,maxTokens,attempt+1);}
    throw new Error(`[fetch] ${e.message}`);
  }
  if(res.status===429&&attempt<3){await sleep(1500*(attempt+1));return callClaudeRaw(user,maxTokens,attempt+1);}
  let data;
  try{data=await res.json();}catch(e){
    if(attempt<3){await sleep(700*(attempt+1));return callClaudeRaw(user,maxTokens,attempt+1);}
    throw new Error(`[parse] ${e.message}`);
  }
  if(!res.ok) throw new Error(`[http] ${res.status}: ${JSON.stringify(data).slice(0,150)}`);
  if(!data?.content) throw new Error(`[shape] ${JSON.stringify(data).slice(0,100)}`);
  if(data.stop_reason==="max_tokens" && attempt<3 && maxTokens<4000){
    return callClaudeRaw(user, Math.min(4000, maxTokens*2), attempt+1);
  }
  return data.content.map(b=>b.text||"").join("\n").trim();
}
function extractField(raw, name){
  const start=`###${name}###`, end=`###${name}_END###`;
  const si=raw.indexOf(start);
  if(si===-1) return raw.trim();
  const from=si+start.length;
  const ei=raw.indexOf(end, from);
  return (ei===-1 ? raw.slice(from) : raw.slice(from,ei)).trim();
}
// extract multiple SEQUENTIAL fields (###NAME1### text ###NAME2### text ... ###END###) — no per-field _END markers
function extractSequentialFields(raw, names){
  const positions = names.map(n=>({n, pos:raw.indexOf(`###${n}###`)}));
  const result={};
  for(let i=0;i<positions.length;i++){
    const {n,pos}=positions[i];
    if(pos===-1){ result[n]=""; continue; }
    const start = pos + `###${n}###`.length;
    let end = raw.indexOf("###END###", start);
    for(let j=i+1;j<positions.length;j++){
      if(positions[j].pos!==-1 && positions[j].pos>start){
        end = end===-1 ? positions[j].pos : Math.min(end, positions[j].pos);
        break;
      }
    }
    result[n] = (end===-1 ? raw.slice(start) : raw.slice(start,end)).trim();
  }
  return result;
}

// long-form overview essay for a subtopic — philosophical/narrative style
async function genSubtopicEssay(topicLabel, subtopicName, levelHint) {
  const lvl = levelHint?.level||3;
  const target = Math.max(120, wb(lvl, 0.18));
  const lo=Math.round(target*0.85), hi=Math.round(target*1.15);
  const levelPart = levelHint ? ` Match the depth/register the learner chose: "${levelHint.label}" (${levelHint.hint}).` : "";
  const raw = await callClaudeRaw(
    `Write a long-form OVERVIEW ESSAY (${lo}-${hi} words) about "${subtopicName}", within the context of the broader topic "${topicLabel}".

// Rework: N unconventional approaches (N scales with level) — simplest starting point -> full realization/mastery
async function genActionPlan(topicLabel, subtopicName, levelHint) {
  const lvl = levelHint?.level||3;
  const n = itemCountForLevel(lvl);
  const totalWords = Math.max(75, wb(lvl,0.15));
  const perIdea = Math.round(totalWords/n);
  const lo=Math.max(10,Math.round(perIdea*0.75)), hi=Math.round(perIdea*1.25);
  const levelPart = levelHint ? ` Match the depth/register the learner chose: "${levelHint.label}" (${levelHint.hint}).` : "";
  const fieldNames=[]; const markerLines=[];
  for(let i=1;i<=n;i++){
    fieldNames.push(`S${i}T`,`S${i}B`);
    markerLines.push(`###S${i}T### idea ${i} title ###S${i}B### idea ${i} body`);
  }
  const raw = await callClaudeRaw(
    `Design a "REWORK" — ${n} UNCONVENTIONAL, creative, sometimes experimental approaches to actually getting real results with "${subtopicName}" (within the broader context of "${topicLabel}"), for someone who always looks for a better way, dislikes following the textbook/official docs/standard instructions, and wants more value and efficiency than the conventional path offers.
Each idea must genuinely challenge or break from the standard/expected way of learning or doing this — a shortcut most people don't know, a contrarian reframing, an unusual technique borrowed from elsewhere, or an experimental method worth trying — never generic "think outside the box" fluff, always something specific and actually usable tied to this exact subject.
Escalate boldness across the ${n}: idea 1 is a simple but non-obvious tweak or hack usable right away; the last idea is a genuinely radical rethink of the standard approach to "${subtopicName}" entirely.${levelPart}
For each idea, give a SHORT punchy title (3-7 words, provocative or memorable — never a generic label like "Idea 1") and a body of ${lo}-${hi} words explaining the idea and specifically why/how it beats the conventional approach.
Write in the SAME language as the topic/subtopic above (detect it and match exactly).
Never use the " character inside the text.
Output EXACTLY in this format, nothing before the first marker or after the last one, no extra commentary:
${markerLines.join(" ")} ###END###`,
    600+n*500
  );
  const fields = extractSequentialFields(raw, fieldNames);
  const arr=[];
  for(let i=1;i<=n;i++) arr.push({title:fields[`S${i}T`]||`Идея ${i}`, body:fields[`S${i}B`]||""});
  return arr;
}

// Socratic-style dialogue: N guiding questions (N scales with level), not direct exposition
async function genSocraticDialogue(topicLabel, subtopicName, levelHint) {
  const lvl = levelHint?.level||3;
  const n = itemCountForLevel(lvl);
  const totalWords = Math.max(60, wb(lvl,0.12));
  const perNote = Math.round(totalWords/n);
  const lo=Math.max(6,Math.round(perNote*0.7)), hi=Math.round(perNote*1.3);
  const levelPart = levelHint ? ` Match the depth/register the learner chose: "${levelHint.label}" (${levelHint.hint}).` : "";
  const fieldNames=[]; const markerLines=[];
  for(let i=1;i<=n;i++){
    fieldNames.push(`Q${i}`,`G${i}`);
    markerLines.push(`###Q${i}### question ${i} ###G${i}### guiding note ${i}${i===n?" (synthesis)":""}`);
  }
  const raw = await callClaudeRaw(
    `Design a SOCRATIC dialogue teaching "${subtopicName}" (within the broader context of "${topicLabel}") — a sequence of exactly ${n} guiding QUESTIONS, in the true Socratic method: each question should provoke the learner to think and arrive at the insight themselves, rather than being told the answer directly. Questions should build on each other, moving from a simple provocation toward the core understanding. Do NOT just ask generic quiz questions — each should genuinely guide reasoning toward the next realization, the way a real Socratic teacher would. Keep each question itself short (one sentence).
For each question, also give a short GUIDING NOTE (${lo}-${hi} words) — not the direct answer, but a nudge, a related observation, or a follow-up prompt that helps the learner think it through, IN THE STYLE of a teacher gently redirecting without lecturing. Only the FINAL guiding note may synthesize/confirm the core insight, since it concludes the dialogue.
Ground every question in the exact subject matter of "${subtopicName}" — never generic philosophical questions unrelated to the actual content.${levelPart}
Write in the SAME language as the topic/subtopic above (detect it and match exactly).
Never use the " character inside the text.
Output EXACTLY in this format, nothing before the first marker or after the last one, no extra commentary:
${markerLines.join(" ")} ###END###`,
    600+n*500
  );
  const fields = extractSequentialFields(raw, fieldNames);
  const arr=[];
  for(let i=1;i<=n;i++) arr.push({question:fields[`Q${i}`]||"", guidance:fields[`G${i}`]||""});
  return arr;
}

// Тест: one question of each of 6 types, tied to the exact subtopic content
async function genTestQuestions(topicLabel, subtopicName, levelHint) {
  const lvl = levelHint?.level||3;
  const tc = testCounts(lvl);
  const levelPart = levelHint ? ` Match the depth/register the learner chose: "${levelHint.label}" (${levelHint.hint}) — keep question text short and simple at lower levels, more nuanced at higher levels.` : "";
  const raw = await callClaudeRaw(
    `Design a small TEST about "${subtopicName}" (within the broader context of "${topicLabel}") with exactly 6 questions, one of each type below. Ground every question strictly in the actual content of "${subtopicName}" — never generic trivia unrelated to it. Keep each question text itself short (one sentence where possible).${levelPart}
Write everything in the SAME language as the topic/subtopic above (detect it and match exactly). Never use the " character inside any text. Use " || " as separator between list items, and " :: " between a matched pair's two sides — never use either separator inside the item text itself, and never use the literal string "###" inside any answer text.

1. SINGLE-CHOICE: one question, exactly ${tc.singleOpts} options (only one correct).
2. MULTI-CHOICE: one question, exactly ${tc.multiOpts} options (2 or more correct).
3. FILL-IN-THE-BLANK: one sentence with a blank shown as ___ , plus the correct missing word/phrase.
4. FREE-TEXT/NUMBER: one short-answer question (a fact, a number, a term) plus the expected answer.
5. ORDERING: one question asking to order exactly ${tc.orderItems} items correctly (steps, chronology, size, etc) — give the items in their CORRECT order.
6. MATCHING: one question asking to match exactly ${tc.matchPairs} pairs of related items — give the pairs.

Output the 14 fields below IN THIS EXACT ORDER, each starting with its marker, nothing before the first marker or after the final ###END###:
###Q1### (single-choice question text)
###Q1OPTS### (${tc.singleOpts} options separated by " || ")
###Q1CORRECT### (correct option number, 1-${tc.singleOpts})
###Q2### (multi-choice question text)
###Q2OPTS### (${tc.multiOpts} options separated by " || ")
###Q2CORRECT### (correct option numbers comma-separated, e.g. 1,3)
###Q3### (fill-in-the-blank sentence with ___ as the blank)
###Q3ANSWER### (correct word or phrase)
###Q4### (free-text or number question)
###Q4ANSWER### (expected answer)
###Q5### (ordering question instruction)
###Q5ITEMS### (${tc.orderItems} items separated by " || ", in CORRECT order)
###Q6### (matching question instruction)
###Q6PAIRS### (${tc.matchPairs} pairs as "left :: right" separated by " || ")
###END###`,
    2800
  );
  const fieldNames = ["Q1","Q1OPTS","Q1CORRECT","Q2","Q2OPTS","Q2CORRECT","Q3","Q3ANSWER","Q4","Q4ANSWER","Q5","Q5ITEMS","Q6","Q6PAIRS"];
  const f = extractSequentialFields(raw, fieldNames);

  const num=(s,fb)=>{const n=parseInt((s||"").trim(),10);return isNaN(n)?fb:n;};
  const splitList=s=>(s||"").split("||").map(x=>x.trim()).filter(Boolean);

  const q1opts = splitList(f.Q1OPTS);
  const q2opts = splitList(f.Q2OPTS);
  const q2correctRaw = (f.Q2CORRECT||"").split(",").map(x=>num(x,1)-1).filter(n=>n>=0);
  const q5items = splitList(f.Q5ITEMS);
  const q6pairs = splitList(f.Q6PAIRS).map(p=>{
    const [l,r]=p.split("::").map(x=>(x||"").trim());
    return {left:l||"", right:r||""};
  });

  return [
    { type:"single", question:f.Q1, options:q1opts, correctIndex:num(f.Q1CORRECT,1)-1 },
    { type:"multi", question:f.Q2, options:q2opts, correctIndices:q2correctRaw },
    { type:"fill", question:f.Q3, answer:f.Q3ANSWER },
    { type:"free", question:f.Q4, answer:f.Q4ANSWER },
    { type:"order", question:f.Q5, items:q5items },
    { type:"match", question:f.Q6, pairs:q6pairs },
  ];
}

// T.7 updated: all active topics = interest; high engagement = priority
async function genLearningProfile(topics, nodeDataMap) {
  const allTopics = topics.filter(t=>!t.deletedAt);
  const deleted   = topics.filter(t=>t.deletedAt).map(t=>t.name||t.prompt).filter(Boolean);
  if(!allTopics.length&&!deleted.length) return null;

  // score each active topic by engagement
  const scored = allTopics.map(t=>{
    const keys=Object.keys(nodeDataMap).filter(k=>k.startsWith(t.id+"/"));
    const likes=keys.reduce((s,k)=>(s+(nodeDataMap[k]?.tunedAbstraction?.length||0)+(nodeDataMap[k]?.tunedBlendKey?1:0)),0);
    const confused=keys.filter(k=>nodeDataMap[k]?.unitConfused).length;
    return {name:t.name||t.prompt, likes, confused, hasActivity:likes>0||confused>0};
  });

  const priority   = scored.filter(t=>t.likes>=3).map(t=>t.name);
  const interested = scored.filter(t=>t.likes>0&&t.likes<3).map(t=>t.name);
  const passive    = scored.filter(t=>!t.hasActivity).map(t=>t.name);

  const raw = await callClaudeRaw(
    `A learner uses a study app. Analyze their learning preferences to guide future curriculum generation.
Priority topics (high engagement, many likes): ${priority.join(", ")||"none"}.
Interested topics (some activity): ${interested.join(", ")||"none"}.
Passive topics (saved but not yet studied): ${passive.join(", ")||"none"}.
Archived/deleted topics (did not find value): ${deleted.join(", ")||"none"}.
In 2-3 sentences, describe what kind of learning structure, depth, and content areas this person prefers. Be specific and actionable for a curriculum designer.
Output ONLY the profile text, wrapped exactly like this and nothing else: ###PROFILE###the profile text here###PROFILE_END###`,
    400
  );
  return extractField(raw,"PROFILE") || null;
}

function subName(item){ return typeof item==="string" ? item : (item?.name||""); }
function isOverviewItem(item){ return typeof item==="object" && item!==null && !!item.isOverview; }
function isExamplesItem(item){ return typeof item==="object" && item!==null && !!item.isExamples; }
function isActionPlanItem(item){ return typeof item==="object" && item!==null && !!item.isActionPlan; }
function isSocraticItem(item){ return typeof item==="object" && item!==null && !!item.isSocratic; }
function isTestItem(item){ return typeof item==="object" && item!==null && !!item.isTest; }
function isConfessionItem(item){ return typeof item==="object" && item!==null && !!item.isConfession; }
function isCuriousItem(item){ return typeof item==="object" && item!==null && !!item.isCurious; }
function getSubsubList(subItem){ return (subItem?.activeLevel!=null && subItem?.byLevel) ? (subItem.byLevel[subItem.activeLevel]||null) : null; }
function getDisplayList(subItem){
  const base = getSubsubList(subItem) || [];
  if(subItem?.curiosityQuestions?.length){
    return [...base, { name:"Любопитно", isCurious:true }];
  }
  return base;
}
function regularUnitCount(subsubList){
  return (subsubList||[]).filter(it=>
    !isOverviewItem(it)&&!isExamplesItem(it)&&!isActionPlanItem(it)&&
    !isSocraticItem(it)&&!isTestItem(it)&&!isConfessionItem(it)&&!isCuriousItem(it)
  ).length || 1;
}

function topicLabel(t){
  if(!t) return "(без заглавие)";
  const candidates=[t.name,t.title,t.prompt,t.topic,t.text,t.query];
  for(const c of candidates){ if(typeof c==="string" && c.trim().length>0) return c.trim(); }
  return t.id ? `План ${t.id.slice(0,8)}` : "(без заглавие)";
}

  // handles BOTH brand-new topics and revisiting/switching level on an existing topic
  async function confirmTopicLevel(level){
    if(!topicOverview) return;
    const updPrefs={...prefs, abstraction:{...prefs.abstraction,[level]:(prefs.abstraction?.[level]||0)+1}};
    setPrefs(updPrefs); await saveJSON("prefs",updPrefs);

    // CASE 1: switching/revisiting level on an already-created topic
    if(topicOverview.existingPlanData){
      const pd = topicOverview.existingPlanData;
      const id = currentTopic.id;
      if(pd.byLevel[level]){
        // already generated for this level — just switch, no regeneration
        const updated = {...pd, activeLevel:level};
        setPlanData(updated); setHierarchy(updated.byLevel[level]);
        await saveJSON(`plan:${id}`, updated);
        setTopicOverview(null);
        setSubtopicIdx(null); setSubsubIdx(null); setSubtopicOverview(null);
        return;
      }
      setTopicOverview(null);
      setLoadingH(true);
      try{
        const levelMeta = LEVELS.find(l=>l.level===level);
        const names = await genSubtopicNames(pd.prompt, null, levelMeta);
        const subtopics = names.map(n=>({name:n, overviewLevels:null, byLevel:{}, activeLevel:null}));
        const updated = {...pd, byLevel:{...pd.byLevel, [level]:subtopics}, activeLevel:level};
        setPlanData(updated); setHierarchy(subtopics);
        await saveJSON(`plan:${id}`, updated);
        setSubtopicIdx(null); setSubsubIdx(null); setSubtopicOverview(null);
      }catch(e){setHomeError(`Грешка: ${e.message}`);}
      finally{setLoadingH(false);}
      return;
    }

    // CASE 2: brand-new topic OR resuming an existing topic that has no cached plan yet
    const {prompt,name,id,newTopic,learningProfile,resumingExisting} = topicOverview;
    if(newTopic && !resumingExisting){
      const next=[newTopic,...topics];
      setTopics(next); await saveJSON("topics",next);
    }

    setTopicOverview(null);
    setLoadingH(true);
    try{
      const levelMeta = LEVELS.find(l=>l.level===level);
      const names = await genSubtopicNames(prompt, learningProfile, levelMeta);
      const subtopics = names.map(n=>({name:n, overviewLevels:null, byLevel:{}, activeLevel:null}));
      const newPlan = {name,prompt,overviewLevels:topicOverview.levels,byLevel:{[level]:subtopics},activeLevel:level};
      setPlanData(newPlan); setHierarchy(subtopics);
      await saveJSON(`plan:${id}`, newPlan);
    }catch(e){setHomeError(`Грешка: ${e.message}`);}
    finally{setLoadingH(false);}
  }

  // best-effort adapter: turn an old-format `hierarchy:${id}` cache into the new byLevel plan shape,
  // preserving whatever was already generated instead of throwing it away
  function migrateLegacyHierarchy(cached){
    const level = cached.chosenLevel || Number(topPreferred(prefs.abstraction,3)) || 3;
    const subtopics = (cached.subtopics||[]).map(s=>{
      const legacyList = s.subsubtopics;
      const hasList = Array.isArray(legacyList) && legacyList.length>0;
      return { name:s.name, overviewLevels:null, byLevel: hasList?{[level]:legacyList}:{}, activeLevel: hasList?level:null };
    });
    return { name:cached.name, prompt:cached.prompt, overviewLevels:null, byLevel:{[level]:subtopics}, activeLevel:level };
  }

  async function resumeTopic(topic){
    setHomeError(null);setHierarchy(null);setPlanData(null);
    setSubtopicIdx(null);setSubsubIdx(null);
    setNodeId(null);setNodeData(null);setLevelCheck(null);setSubtopicOverview(null);
    setCurrentTopic(topic);

    let cached=await loadJSON(`plan:${topic.id}`,null);
    if(!cached){
      // not migrated yet — check the old storage key before assuming this topic has nothing generated
      const legacy = await loadJSON(`hierarchy:${topic.id}`,null);
      if(legacy){
        cached = migrateLegacyHierarchy(legacy);
        await saveJSON(`plan:${topic.id}`, cached); // persist migrated shape so this only happens once
      }
    }
    if(cached){
      setPlanData(cached);
      setHierarchy(cached.byLevel[cached.activeLevel]);
      return;
    }

    // truly nothing cached anywhere — go through the overview/level-choice flow (same as a new topic)
    setLoadingH(true);
    try{
      const levels=await genOverviewLevels(topic.prompt||topic.name);
      setLoadingH(false);
      setTopicOverview({loading:false, levels, prompt:topic.prompt||topic.name, name:topic.name, id:topic.id, newTopic:null, learningProfile:null, resumingExisting:true});
    }catch(e){setLoadingH(false);setHomeError(`Грешка: ${e.message}`);}
  }

  async function generateCuriosityAnswers(subIdx){
    const subItem = hierarchy[subIdx];
    const qs = subItem.curiosityQuestions||[];
    const unansweredIdx = qs.map((q,i)=>q.answered?-1:i).filter(i=>i!==-1);
    if(!unansweredIdx.length) return;

    setLoadingL(true); setNodeError(null);
    try{
      const levelMeta = LEVELS.find(l=>l.level===subItem.activeLevel);
      const unansweredTexts = unansweredIdx.map(i=>qs[i].q);
      const answers = await genCuriosityAnswersBatch(currentTopic.prompt||currentTopic.name, subItem.name, unansweredTexts, levelMeta);

      const updatedQs = qs.map((q,i)=>{
        const pos = unansweredIdx.indexOf(i);
        return pos===-1 ? q : {...q, answer:answers[pos]||"", answered:true};
      });
      const updatedSub = {...subItem, curiosityQuestions:updatedQs};
      const updatedHierarchy = hierarchy.map((s,idx)=> idx===subIdx ? updatedSub : s);
      setHierarchy(updatedHierarchy);
      setNodeData({questions:updatedQs});
      const updatedPlan = {...planData, byLevel:{...planData.byLevel, [planData.activeLevel]:updatedHierarchy}};
      setPlanData(updatedPlan);
      await saveJSON(`plan:${currentTopic.id}`, updatedPlan);
    }catch(e){setNodeError(`Грешка: ${e.message}`);}
    finally{setLoadingL(false);}
  }

  async function tuneEssay(){
    if(!nodeData||nodeData.tunedEssay)return;
    const level = nodeData.essayLevel;
    const updNode={...nodeData,tunedEssay:true};
    setNodeData(updNode);
    await saveJSON(`node:${nodeId}`,updNode);
    if(level){
      const updPrefs={...prefs,abstraction:{...prefs.abstraction,[level]:(prefs.abstraction?.[level]||0)+1}};
      setPrefs(updPrefs); await saveJSON("prefs",updPrefs);
    }
  }

  async function doLoadLevels(id,sub,subsub,subLevel,unitCount,base){
    setLoadingL(true);setNodeError(null);
    try{
      const abstraction=await genAbstraction(currentTopic.prompt||currentTopic.name,sub,subsub,subLevel,unitCount);
      const updated={...base,abstraction};
      setNodeData(updated);
      const r=await saveJSON(`node:${id}`,updated);
      if(!r.ok)setNodeError(`Генерирано, но не е запазено: ${r.detail}`);
    }catch(e){setNodeError(`Грешка: ${e.message}`);}
    finally{setLoadingL(false);}
  }

  function switchTab(next){
    setTab(next);setNodeError(null);
    // channels hidden (T.3) — no action for channels tab
    if(next==="blend"&&!nodeData?.blend&&!loadingB&&canBlend){
      const sub=hierarchy[subtopicIdx].name,subsub=hierarchy[subtopicIdx].subsubtopics[subsubIdx];
      doGenBlend(nodeId,sub,subsub);
    }
  }

  // T.4: blend uses only abstraction prefs
  async function doGenBlend(id,sub,subsub){
    const level=Number(topPreferred(prefs.abstraction,3));
    setLoadingB(true);setNodeError(null);
    try{
      const text=await genBlend(currentTopic.prompt||currentTopic.name,sub,subsub,level);
      setNodeData(prev=>{
        const u={...prev,blend:{text,level},tunedBlendKey:null};
        saveJSON(`node:${id}`,u).then(r=>{if(!r.ok)setNodeError(`Микс не е запазен: ${r.detail}`);});
        return u;
      });
    }catch(e){setNodeError(`Грешка: ${e.message}`);}
    finally{setLoadingB(false);}
  }

  async function tune(type,key){
    if(!nodeData)return;
    const field=type==="abstraction"?"tunedAbstraction":"tunedPersonality";
    if(nodeData[field]?.includes(key))return;
    const updNode={...nodeData,[field]:[...(nodeData[field]||[]),key]};
    const updPrefs={...prefs,[type]:{...prefs[type],[key]:(prefs[type]?.[key]||0)+1}};
    setNodeData(updNode);setPrefs(updPrefs);
    await saveJSON(`node:${nodeId}`,updNode);
    await saveJSON("prefs",updPrefs);
  }

  async function tuneBlend(){
    if(!nodeData?.blend||nodeData.tunedBlendKey)return;
    const {level}=nodeData.blend;
    const updNode={...nodeData,tunedBlendKey:`${level}`};
    const updPrefs={...prefs,abstraction:{...prefs.abstraction,[level]:(prefs.abstraction?.[level]||0)+1}};
    setNodeData(updNode);setPrefs(updPrefs);
    await saveJSON(`node:${nodeId}`,updNode);
    await saveJSON("prefs",updPrefs);
  }

  async function markUnitConfused(){
    if(!nodeData||nodeData.unitConfused)return;
    const u={...nodeData,unitConfused:true};
    setNodeData(u);await saveJSON(`node:${nodeId}`,u);
  }
  async function unmarkUnitConfused(){
    if(!nodeData||!nodeData.unitConfused)return;
    const u={...nodeData,unitConfused:false};
    setNodeData(u);await saveJSON(`node:${nodeId}`,u);
  }

  async function runLevelCheck(){
    setLoadingLC(true);setLcError(null);setLevelCheck(null);
    try{
      const nodeMap={};
      for(const sub of hierarchy){
        const list = getSubsubList(sub) || [];
        for(const subsub of list){
          const id=`${currentTopic.id}/${slugify(sub.name)}/${slugify(subName(subsub))}`;
          const nd=await loadJSON(`node:${id}`,null);
          if(nd)nodeMap[id]=nd;
        }
      }
      setLevelCheck(await genLevelCheck(currentTopic.prompt||currentTopic.name,hierarchy,prefs,nodeMap));
    }catch(e){setLcError(`Грешка: ${e.message}`);}
    finally{setLoadingLC(false);}
  }

  // T.5: generate adapted topic
  async function generateAllContentForSubtopic(subIdx){
    if(!currentTopic||!planData) return;
    setGenAll(true); setGenAllProgress(""); setGenAllError(null);
    const failures=[];
    try{
      let curHierarchy = hierarchy;
      let curPlan = planData;
      const topicPrompt = currentTopic.prompt||currentTopic.name;
      let subItem = curHierarchy[subIdx];
      let subsubList = getSubsubList(subItem);
      const subLevel = subItem.activeLevel;
      const subLevelMeta = LEVELS.find(l=>l.level===subLevel);

      if(!subsubList || !subsubList.length) return; // subtopic must already have a chosen level/units

      setGenAllProgress(`${subItem.name}…`);
      const allKeys = await loadJSON("allNodeKeys", []);
      let keysUpdated = [...allKeys];

      for(let ui=0; ui<subsubList.length; ui++){
        const item = subsubList[ui];
        if(isCuriousItem(item)) continue; // dynamic, only appears from user questions
        const uName = subName(item);
        setGenAllProgress(`${subItem.name} — ${uName}`);
        const id = `${currentTopic.id}/${slugify(subItem.name)}/L${subLevel}/${slugify(uName)}`;

        // each unit gets its own try/catch — one failure must not abort the rest of the batch
        try{
          const existing = await loadJSON(`node:${id}`, null);

          if(isOverviewItem(item)){
            if(!existing?.essay){
              const essay = await genSubtopicEssay(topicPrompt, subItem.name, subLevelMeta);
              await saveJSON(`node:${id}`, {...(existing||{unitConfused:false}), essay, essayLevel:subLevel, tunedEssay:existing?.tunedEssay||false});
            }
          } else if(isExamplesItem(item)){
            if(!existing?.examples){
              const examples = await genSubtopicExamples(topicPrompt, subItem.name, subLevelMeta);
              await saveJSON(`node:${id}`, {...(existing||{unitConfused:false}), examples, examplesLevel:subLevel, tunedExamples:existing?.tunedExamples||false});
            }
          } else if(isActionPlanItem(item)){
            if(!existing?.stages?.length){
              const stages = await genActionPlan(topicPrompt, subItem.name, subLevelMeta);
              await saveJSON(`node:${id}`, {...(existing||{unitConfused:false}), stages, actionPlanLevel:subLevel, tunedActionPlan:existing?.tunedActionPlan||false});
            }
          } else if(isSocraticItem(item)){
            if(!existing?.steps?.length){
              const steps = await genSocraticDialogue(topicPrompt, subItem.name, subLevelMeta);
              await saveJSON(`node:${id}`, {...(existing||{unitConfused:false}), steps, socraticLevel:subLevel, tunedSocratic:existing?.tunedSocratic||false});
            }
          } else if(isTestItem(item)){
            if(!existing?.testQuestions?.length){
              const testQuestions = await genTestQuestions(topicPrompt, subItem.name, subLevelMeta);
              await saveJSON(`node:${id}`, {...(existing||{unitConfused:false}), testQuestions, testLevel:subLevel, tunedTest:existing?.tunedTest||false});
            }
          } else if(isConfessionItem(item)){
            if(!existing?.confession){
              const confession = await genAiConfession(topicPrompt, subItem.name, subLevelMeta);
              await saveJSON(`node:${id}`, {...(existing||{unitConfused:false}), confession, confessionLevel:subLevel, tunedConfession:existing?.tunedConfession||false});
            }
          } else {
            if(!existing?.abstraction?.length){
              const abstraction = await genAbstraction(topicPrompt, subItem.name, uName, subLevel, regularUnitCount(subsubList));
              await saveJSON(`node:${id}`, {...(existing||{personality:[],blend:null,tunedPersonality:[],tunedBlendKey:null,unitConfused:false}), abstraction, tunedAbstraction:existing?.tunedAbstraction||[]});
            }
          }
          if(!keysUpdated.includes(id)){ keysUpdated=[...keysUpdated,id]; await saveJSON("allNodeKeys", keysUpdated); }
        }catch(itemErr){
          failures.push(uName);
          console.error(`generateAll failed for "${uName}":`, itemErr);
          // brief pause before moving on, in case it was a transient rate-limit
          await sleep(800);
        }
      }
      setGenAllProgress("");
      if(failures.length) setGenAllError(`Генерирано с изключение на: ${failures.join(", ")}. Можеш да отвориш всяка от тях поотделно за да я генерираш.`);
    }catch(e){ setGenAllError(`Грешка при масово генериране: ${e.message}`); }
    finally{ setGenAll(false); }
  }


  async function generateAdaptedTopic(){
    if(!levelCheck||!currentTopic)return;
    setGA(true);
    try{
      const adaptedName=await genAdaptedTopicName(currentTopic.prompt||currentTopic.name,levelCheck);

      // No difficulty escalation: keep target at the SAME level the learner already showed comfort with
      // (never higher) — the goal is to clarify what confused them and reinforce what's shaky, not push harder.
      const currentTopLevel = topPreferred(prefs.abstraction, null);
      const currentTopLvlLabel = currentTopLevel ? LEVELS.find(l=>l.level===Number(currentTopLevel))?.label : null;

      const confusedHint = (levelCheck.missing)
        ? ` Prioritize re-explaining, from a genuinely different angle (different analogy, filling a likely missing prerequisite, or simpler language), the specific things the learner found confusing or unclear: ${levelCheck.missing}.`
        : "";
      const improveHint = (levelCheck.improve && levelCheck._improveUnits?.length)
        ? ` Also reinforce and solidify these topics the learner only understood shallowly, using the SAME depth level they're already comfortable with (${currentTopLvlLabel||"their usual level"}) — do not jump to a harder level, focus on making the existing depth truly click: ${levelCheck.improve}.`
        : "";
      const ignoredHint = (levelCheck._ignoredUnits?.length)
        ? ` Minimize or deprioritize content similar to these topics the learner showed no interest in: ${levelCheck._ignoredUnits.join(", ")}.`
        : "";
      const adaptedPrompt=`${currentTopic.prompt||currentTopic.name} — цел: помогни на ученика да разбере по-добре (не по-трудно) вече засегнатия материал.${confusedHint}${improveHint}${ignoredHint}`;
      const id=slugify(adaptedName)+"-"+Date.now().toString(36);

      // T.6: link parent<->child
      const newTopic={id,name:adaptedName,prompt:adaptedPrompt,createdAt:Date.now(),parentId:currentTopic.id};
      const updatedTopics=topics.map(t=>t.id===currentTopic.id?{...t,childId:id}:t);
      updatedTopics.unshift(newTopic);
      setTopics(updatedTopics);
      await saveJSON("topics",updatedTopics);

      // generate at the learner's current comfort level (no extra screen — continuity, not escalation)
      setLoadingH(true);
      const level = Number(currentTopLevel) || 3;
      const levelMeta = LEVELS.find(l=>l.level===level);
      const overviewLevels = await genOverviewLevels(adaptedPrompt);
      const names = await genSubtopicNames(adaptedPrompt, null, levelMeta);
      const subtopics = names.map(n=>({name:n, overviewLevels:null, byLevel:{}, activeLevel:null}));
      const newPlan = {name:adaptedName, prompt:adaptedPrompt, overviewLevels, byLevel:{[level]:subtopics}, activeLevel:level};
      await saveJSON(`plan:${id}`, newPlan);

      // navigate to new topic
      setCurrentTopic(newTopic);
      setPlanData(newPlan);
      setHierarchy(subtopics);
      setSubtopicIdx(null);setSubsubIdx(null);
      setNodeId(null);setNodeData(null);setLevelCheck(null);
    }catch(e){setLcError(`Грешка при генериране: ${e.message}`);}
    finally{setGA(false);setLoadingH(false);}
  }

  /* render */
  return (
    <div className="min-h-screen bg-stone-950 text-stone-200">
      <header className="border-b border-stone-800 px-4 py-3 flex items-center justify-between">
        <button onClick={goHome} className="flex items-center gap-2 group">
          <span className="text-amber-500"><ApertureIcon size={20}/></span>
          <span className="font-display font-bold text-lg text-stone-100">Aperture</span>
          {currentTopic && <span className="font-mono-cal text-xs text-stone-500">/ {topicLabel(currentTopic)}</span>}
        </button>
        <button onClick={toggleStorage}
          className={`font-mono-cal text-[11px] uppercase tracking-wide px-2 py-1 rounded border transition-colors ${storageMode==="supabase"?"border-emerald-800 text-emerald-500 bg-emerald-950/30":"border-amber-800 text-amber-500 bg-amber-950/30"}`}>
          {storageMode==="supabase"?"☁ Supabase":"📱 Local"}
        </button>
      </header>
      <main className="max-w-2xl mx-auto px-4 py-8">
        {booting?<Spinner label="зареждам…"/>
          :topicOverview?(
            <OverviewPicker title={topicOverview.name||topicOverview.prompt}
              levels={topicOverview.levels} loading={topicOverview.loading}
              error={topicOverview.error||homeError} onPick={confirmTopicLevel} picking={loadingH}
              existingLevels={topicOverview.existingPlanData?Object.keys(topicOverview.existingPlanData.byLevel||{}).map(Number):[]}
              onBack={()=>{setTopicOverview(null); if(!topicOverview.existingPlanData) setCurrentTopic(null);}}/>
          ):!currentTopic?(
            <HomeScreen topicInput={topicInput} setTopicInput={setTopicInput}
              onStart={()=>startTopic(topicInput)} topics={activeTopics} deletedTopics={deletedTopics}
              onResume={resumeTopic} error={homeError}
              onDelete={softDeleteTopic} onRestore={restoreTopic}
              showTrash={showTrash} setShowTrash={setShowTrash}/>
          ):loadingH?<Spinner label="изграждам учебен план…"/>
          :!hierarchy?<ErrorNote message={homeError||"Нещо се обърка."} onRetry={()=>resumeTopic(currentTopic)}/>
          :subtopicIdx===null?(
            <SubtopicList topic={currentTopic} hierarchy={hierarchy}
              onPick={pickSubtopic}
              onLevelCheck={runLevelCheck} loadingLevelCheck={loadingLC}
              levelCheck={levelCheck} levelCheckError={lcError}
              onDelete={()=>softDeleteTopic(currentTopic.id)}
              onGenerateAdapted={generateAdaptedTopic} generatingAdapted={generatingAdapted}
              allTopics={topics}
              onNavigateTopic={t=>{resumeTopic(t);}}
              onChangeLevel={openTopicLevelPicker}
              currentLevel={planData?.activeLevel}/>
          ):subtopicOverview&&subtopicOverview.subIdx===subtopicIdx?(
            <OverviewPicker title={hierarchy[subtopicIdx].name}
              levels={subtopicOverview.levels} loading={subtopicOverview.loading}
              error={subtopicOverview.error} onPick={confirmSubtopicLevel} picking={subtopicOverview.confirming}
              existingLevels={Object.keys(hierarchy[subtopicIdx].byLevel||{}).map(Number)}
              onBack={()=>{setSubtopicOverview(null);setSubtopicIdx(null);}}/>
          ):subsubIdx===null?(
            <SubsubList topic={currentTopic} subtopic={hierarchy[subtopicIdx]}
              onBack={()=>{setSubtopicIdx(null);setSubtopicOverview(null);setNodeId(null);setNodeData(null);}}
              onPick={i=>openNode(subtopicIdx,i)}
              onChangeLevel={()=>openSubtopicLevelPicker(subtopicIdx)}
              currentLevel={hierarchy[subtopicIdx].activeLevel}
              onGenerateAll={()=>generateAllContentForSubtopic(subtopicIdx)} generatingAll={generatingAll} genAllProgress={genAllProgress} genAllError={genAllError}/>
          ):(
            <NodeView
              topic={topicLabel(currentTopic)}
              subtopic={hierarchy[subtopicIdx].name}
              subsub={subName(getDisplayList(hierarchy[subtopicIdx])[subsubIdx])}
              isOverview={isOverviewItem(getDisplayList(hierarchy[subtopicIdx])[subsubIdx])}
              isExamples={isExamplesItem(getDisplayList(hierarchy[subtopicIdx])[subsubIdx])}
              isActionPlan={isActionPlanItem(getDisplayList(hierarchy[subtopicIdx])[subsubIdx])}
              isSocratic={isSocraticItem(getDisplayList(hierarchy[subtopicIdx])[subsubIdx])}
              isTest={isTestItem(getDisplayList(hierarchy[subtopicIdx])[subsubIdx])}
              isConfession={isConfessionItem(getDisplayList(hierarchy[subtopicIdx])[subsubIdx])}
              isCurious={isCuriousItem(getDisplayList(hierarchy[subtopicIdx])[subsubIdx])}
              onBack={()=>{setSubsubIdx(null);setNodeId(null);setNodeData(null);setNodeError(null);}}
              tab={tab} setTab={switchTab} nodeData={nodeData}
              loadingLevels={loadingL} loadingBlend={loadingB}
              error={nodeError}
              onRetryLevels={()=>doLoadLevels(nodeId,hierarchy[subtopicIdx].name,subName(getDisplayList(hierarchy[subtopicIdx])[subsubIdx]),hierarchy[subtopicIdx].activeLevel,regularUnitCount(getDisplayList(hierarchy[subtopicIdx])),nodeData)}
              onRetryEssay={()=>doLoadEssay(nodeId,hierarchy[subtopicIdx].name,hierarchy[subtopicIdx].activeLevel,nodeData)}
              onRetryExamples={()=>doLoadExamples(nodeId,hierarchy[subtopicIdx].name,hierarchy[subtopicIdx].activeLevel,nodeData)}
              onRetryActionPlan={()=>doLoadActionPlan(nodeId,hierarchy[subtopicIdx].name,hierarchy[subtopicIdx].activeLevel,nodeData)}
              onRetrySocratic={()=>doLoadSocratic(nodeId,hierarchy[subtopicIdx].name,hierarchy[subtopicIdx].activeLevel,nodeData)}
              onRetryTest={()=>doLoadTest(nodeId,hierarchy[subtopicIdx].name,hierarchy[subtopicIdx].activeLevel,nodeData)}
              onRetryConfession={()=>doLoadConfession(nodeId,hierarchy[subtopicIdx].name,hierarchy[subtopicIdx].activeLevel,nodeData)}
              onRetryCurious={()=>generateCuriosityAnswers(subtopicIdx)}
              onAsk={askCuriosityQuestion}
              curiosityQuestions={hierarchy[subtopicIdx].curiosityQuestions||[]}
              onTuneAbstraction={key=>tune("abstraction",key)}
              onTuneBlend={tuneBlend}
              onTuneEssay={tuneEssay}
              onTuneExamples={tuneExamples}
              onTuneActionPlan={tuneActionPlan}
              onTuneSocratic={tuneSocratic}
              onTuneTest={tuneTest}
              onTuneConfession={tuneConfession}
              onUnitConfused={markUnitConfused} onUnitUnconfused={unmarkUnitConfused}
              prefs={prefs} topLevel={topLevel}
              canBlend={canBlend} onGenerateBlend={()=>doGenBlend(nodeId,hierarchy[subtopicIdx].name,subName(getDisplayList(hierarchy[subtopicIdx])[subsubIdx]))}/>
          )}
      </main>
    </div>
  );
}

/* ── Screens ─────────────────────────────────────────────────────────── */
function HomeScreen({topicInput,setTopicInput,onStart,topics,deletedTopics,onResume,error,onDelete,onRestore,showTrash,setShowTrash}){
  return <div className="space-y-8">
    <div>
      <h1 className="font-display text-2xl font-bold text-stone-100 mb-1">Какво искаш да научиш?</h1>
      <p className="font-read text-stone-400 text-sm">Напиши тема или въпрос — Aperture ще генерира учебен план и ще открие кой стил на обяснение ти пасва.</p>
    </div>
    <div className="flex gap-2">
      <input value={topicInput} onChange={e=>setTopicInput(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter")onStart();}}
        placeholder="напр. Как работи логистичната регресия?"
        className="flex-1 bg-stone-900 border border-stone-700 rounded px-3 py-2 text-stone-100 font-read placeholder:text-stone-500 focus:outline-none focus:border-amber-600"/>
      <button onClick={onStart} className="font-mono-cal text-xs uppercase tracking-wide bg-amber-600 hover:bg-amber-500 text-stone-950 font-medium px-4 rounded">Старт</button>
    </div>
    {error&&<ErrorNote message={error}/>}
    {topics.length>0&&<div>
      <div className="flex items-center justify-between mb-2">
        <div className="font-mono-cal text-xs uppercase tracking-wide text-stone-500">Активни планове</div>
        {deletedTopics.length>0&&<button onClick={()=>setShowTrash(!showTrash)} className="font-mono-cal text-xs text-stone-500 hover:text-amber-400 flex items-center gap-1"><Trash2 size={12}/>{showTrash?"скрий":"кошче"} ({deletedTopics.length})</button>}
      </div>
      <div className="space-y-1">
        {topics.map(t=>(
          <div key={t.id} className="flex items-center gap-2 group">
            <button onClick={()=>onResume(t)} className="flex-1 text-left px-3 py-2 rounded border border-stone-800 hover:border-stone-600 flex items-center justify-between">
              <div>
                <div className="font-read text-stone-200">{topicLabel(t)}</div>
                {t.name&&t.prompt&&t.name!==t.prompt&&<div className="font-mono-cal text-[10px] text-stone-500 mt-0.5 truncate max-w-xs">{t.prompt}</div>}
                {t.parentId&&<div className="font-mono-cal text-[10px] text-stone-500">↳ адаптиран план</div>}
                {t.childId&&<div className="font-mono-cal text-[10px] text-sky-600">→ има адаптация</div>}
              </div>
              <span className="text-stone-600 group-hover:text-amber-500 shrink-0"><ChevronRight size={16}/></span>
            </button>
            <button onClick={()=>onDelete(t.id)} className="p-2 text-stone-600 hover:text-red-400 transition-colors"><Trash2 size={14}/></button>
          </div>
        ))}
      </div>
    </div>}
    {showTrash&&deletedTopics.length>0&&<div>
      <div className="font-mono-cal text-xs uppercase tracking-wide text-stone-600 mb-2">Архивирани</div>
      <div className="space-y-1">
        {deletedTopics.map(t=>(
          <div key={t.id} className="flex items-center gap-2">
            <div className="flex-1 px-3 py-2 rounded border border-stone-800/50 opacity-50">
              <div className="font-read text-stone-400 text-sm">{topicLabel(t)}</div>
            </div>
            <button onClick={()=>onRestore(t.id)} className="font-mono-cal text-xs text-stone-500 hover:text-emerald-400 px-2">↩ върни</button>
          </div>
        ))}
      </div>
    </div>}
  </div>;
}

function SubtopicList({topic,hierarchy,onPick,onLevelCheck,loadingLevelCheck,levelCheck,levelCheckError,onDelete,onGenerateAdapted,generatingAdapted,allTopics,onNavigateTopic,onChangeLevel,currentLevel}){
  // T.6: find related topics
  const parentTopic = topic.parentId ? allTopics.find(t=>t.id===topic.parentId) : null;
  const childTopic  = topic.childId  ? allTopics.find(t=>t.id===topic.childId)  : null;
  const currentLevelMeta = currentLevel ? LEVELS.find(l=>l.level===currentLevel) : null;

  return <div className="space-y-4">
    <div className="flex items-start justify-between gap-2">
      <div>
        <h2 className="font-display text-xl font-bold text-stone-100">{topicLabel(topic)}</h2>
        {topic.prompt&&(topic.name||topic.title)&&topic.prompt!==(topic.name||topic.title)&&(
          <p className="font-read text-stone-400 text-sm mt-1 leading-relaxed">{topic.prompt}</p>
        )}
      </div>
      <button onClick={onDelete} className="shrink-0 p-1.5 text-stone-600 hover:text-red-400 transition-colors mt-1"><Trash2 size={16}/></button>
    </div>

    <div className="flex flex-wrap gap-2">
      {onChangeLevel && <button onClick={onChangeLevel}
        className="flex items-center gap-1.5 font-mono-cal text-xs uppercase tracking-wide px-3 py-1.5 rounded border border-stone-700 text-stone-400 hover:border-amber-500 hover:text-amber-400 w-fit">
        <Sparkles size={12}/> Ниво: {currentLevelMeta?.label||"—"} · смени
      </button>}
    </div>

    {/* T.6: related topic links */}
    {(parentTopic||childTopic)&&<div className="space-y-1">
      {parentTopic&&<button onClick={()=>onNavigateTopic(parentTopic)} className="flex items-center gap-2 text-sm font-mono-cal text-stone-500 hover:text-amber-400">
        <ChevronLeft size={14}/> Базов план: {parentTopic.name}
      </button>}
      {childTopic&&<button onClick={()=>onNavigateTopic(childTopic)} className="flex items-center gap-2 text-sm font-mono-cal text-sky-600 hover:text-sky-400">

function looksLikeCode(text){
  const lines = text.split("\n").filter(l=>l.trim());
  if(lines.length===0) return false;
  const codeIndicators = lines.filter(l =>
    /^\s{2,}\S/.test(l) ||           // indentation
    /^[-*]\s/.test(l) ||             // list/yaml item
    /^[\w.\-\/]+:\s*\S/.test(l) ||   // key: value
    /^[$#]\s/.test(l) ||             // shell prompt/comment
    /^(function|def|class|import|const|let|var|SELECT|FROM)\b/i.test(l.trim())
  ).length;
  return codeIndicators >= Math.max(1, Math.ceil(lines.length*0.3));
}

function ExamplesPanel({loading,examples,tuned,onTune}){
  if(loading) return <Spinner label="генерирам практически примери…"/>;
  if(!examples) return null;
  // split into blocks by blank lines; each block's first line (if short, no leading whitespace) is treated as a title
  const blocks = examples.split(/\n\s*\n/).filter(b=>b.trim());
  return <div className="space-y-4">
    <div className="space-y-4">
      {blocks.map((block,i)=>{
        const lines = block.split("\n");
        const firstLine = lines[0]||"";
        const looksLikeTitle = firstLine.trim().length>0 && firstLine.trim().length<60 && !/^\s/.test(firstLine) && lines.length>1;
        const title = looksLikeTitle ? firstLine.trim() : null;
        const body = (looksLikeTitle ? lines.slice(1).join("\n") : block).trim();
        const isCode = looksLikeCode(body);
        return <div key={i} className="rounded border border-stone-800 overflow-hidden">
          {title && <div className="font-mono-cal text-xs uppercase tracking-wide text-emerald-500 px-3 py-2 bg-emerald-950/20 border-b border-stone-800">{title}</div>}
          {isCode
            ? <pre className="font-mono-cal text-sm text-stone-200 p-3 overflow-x-auto whitespace-pre">{body}</pre>
            : <p className="font-read text-stone-200 leading-relaxed text-lg p-3 whitespace-pre-line">{body}</p>}
        </div>;
      })}
    </div>
    <div><TuneButton tuned={tuned} onClick={onTune}/></div>
  </div>;
}

    <div className="space-y-3">
      {stages.map((s,i)=>(
        <div key={i} className="rounded border border-violet-900/50 bg-violet-950/10 p-4">
          <div className="flex items-center gap-2 mb-2">
            <span className="shrink-0 w-6 h-6 rounded-full bg-violet-900/50 text-violet-300 font-mono-cal text-xs flex items-center justify-center">{i+1}</span>
            <span className="font-mono-cal text-xs uppercase tracking-wide text-violet-400">{s.title}</span>
          </div>
          <p className="font-read text-stone-200 leading-relaxed text-lg">{s.body}</p>
        </div>
      ))}
    </div>
    <div><TuneButton tuned={tuned} onClick={onTune}/></div>
  </div>;
}

function SocraticPanel({loading,steps,tuned,onTune}){
  if(loading) return <Spinner label="изграждам сократически диалог…"/>;
  if(!steps||!steps.length) return null;
  return <div className="space-y-4">
    <div className="space-y-3">
      {steps.map((s,i)=>(
        <div key={i} className="rounded border border-teal-900/50 bg-teal-950/10 p-4">
          <div className="flex items-start gap-2 mb-2">
            <span className="shrink-0 w-6 h-6 rounded-full bg-teal-900/50 text-teal-300 font-mono-cal text-xs flex items-center justify-center">?</span>
            <p className="font-read text-stone-100 leading-relaxed text-lg font-medium">{s.question}</p>
          </div>
          {s.guidance && <p className="font-read text-teal-300/80 leading-relaxed text-base italic pl-8">{s.guidance}</p>}
        </div>
      ))}
    </div>
    <div><TuneButton tuned={tuned} onClick={onTune}/></div>
  </div>;
}

function TestPanel({loading,questions,tuned,onTune}){
  if(loading) return <Spinner label="генерирам тест (6 въпроса)…"/>;
  if(!questions||!questions.length) return null;
  return <div className="space-y-4">
    <div className="space-y-3">
      {questions.map((q,i)=>{
        if(q.type==="single") return <SingleChoiceQ key={i} q={q}/>;
        if(q.type==="multi") return <MultiChoiceQ key={i} q={q}/>;
        if(q.type==="fill") return <FillBlankQ key={i} q={q}/>;
        if(q.type==="free") return <FreeTextQ key={i} q={q}/>;
        if(q.type==="order") return <OrderQ key={i} q={q}/>;
        if(q.type==="match") return <MatchQ key={i} q={q}/>;
        return null;
      })}
    </div>
    <div><TuneButton tuned={tuned} onClick={onTune}/></div>
  </div>;
}

function QCard({label,question,children}){
  return <div className="rounded border border-rose-900/50 bg-rose-950/10 p-4 space-y-3">
    <div className="font-mono-cal text-[10px] uppercase tracking-wide text-rose-500">{label}</div>
    <p className="font-read text-stone-100 text-lg leading-relaxed">{question}</p>
    {children}
  </div>;
}
function CheckBtn({onClick,children}){
  return <button onClick={onClick} className="font-mono-cal text-xs uppercase tracking-wide bg-rose-700 hover:bg-rose-600 text-white font-medium px-3 py-1.5 rounded transition-colors">{children||"Провери"}</button>;
}
function Result({ok,text}){
  return <p className={`font-mono-cal text-xs ${ok?"text-emerald-400":"text-red-400"}`}>{ok?"✓ Вярно":`✗ ${text}`}</p>;
}

function SingleChoiceQ({q}){
  const [sel,setSel]=useState(null);
  const [checked,setChecked]=useState(false);
  return <QCard label="Избор на един отговор" question={q.question}>
    <div className="space-y-1">
      {(q.options||[]).map((opt,i)=>(
        <button key={i} onClick={()=>{setSel(i);setChecked(false);}}
          className={`w-full text-left px-3 py-2 rounded border text-sm font-read ${sel===i?"border-rose-500 bg-rose-900/30 text-stone-100":"border-stone-700 text-stone-300 hover:border-stone-500"}`}>
          {opt}
        </button>
      ))}
    </div>
    {!checked ? <CheckBtn onClick={()=>setChecked(true)}/> : <Result ok={sel===q.correctIndex} text={`Верен отговор: ${q.options?.[q.correctIndex]}`}/>}
  </QCard>;
}

function MultiChoiceQ({q}){
  const [sel,setSel]=useState([]);
  const [checked,setChecked]=useState(false);
  function toggle(i){ setChecked(false); setSel(s=>s.includes(i)?s.filter(x=>x!==i):[...s,i]); }
  const correctSet = new Set(q.correctIndices||[]);
  const selSet = new Set(sel);
  const ok = correctSet.size===selSet.size && [...correctSet].every(i=>selSet.has(i));
  return <QCard label="Избор на няколко отговора" question={q.question}>
    <div className="space-y-1">
      {(q.options||[]).map((opt,i)=>(
        <button key={i} onClick={()=>toggle(i)}
          className={`w-full text-left px-3 py-2 rounded border text-sm font-read flex items-center gap-2 ${sel.includes(i)?"border-rose-500 bg-rose-900/30 text-stone-100":"border-stone-700 text-stone-300 hover:border-stone-500"}`}>
          <span className={`w-3.5 h-3.5 rounded-sm border shrink-0 ${sel.includes(i)?"bg-rose-500 border-rose-500":"border-stone-500"}`}/>
          {opt}
        </button>
      ))}
    </div>
    {!checked ? <CheckBtn onClick={()=>setChecked(true)}/> : <Result ok={ok} text={`Верни отговори: ${(q.correctIndices||[]).map(i=>q.options?.[i]).join(", ")}`}/>}
  </QCard>;
}

function FillBlankQ({q}){
  const [val,setVal]=useState("");
  const [checked,setChecked]=useState(false);
  const ok = val.trim().toLowerCase()===((q.answer||"").trim().toLowerCase());
  return <QCard label="Попълни липсващото" question={q.question}>
    <input value={val} onChange={e=>{setVal(e.target.value);setChecked(false);}}
      placeholder="Твоят отговор…"
      className="w-full bg-stone-900 border border-stone-700 rounded px-3 py-2 text-stone-100 font-read text-sm placeholder:text-stone-500 focus:outline-none focus:border-rose-600"/>
    {!checked ? <CheckBtn onClick={()=>setChecked(true)}/> : <Result ok={ok} text={`Верен отговор: ${q.answer}`}/>}
  </QCard>;
}

function FreeTextQ({q}){
  const [val,setVal]=useState("");
  const [revealed,setRevealed]=useState(false);
  return <QCard label="Свободен отговор" question={q.question}>
    <input value={val} onChange={e=>setVal(e.target.value)}
      placeholder="Твоят отговор…"
      className="w-full bg-stone-900 border border-stone-700 rounded px-3 py-2 text-stone-100 font-read text-sm placeholder:text-stone-500 focus:outline-none focus:border-rose-600"/>
    {!revealed ? <CheckBtn onClick={()=>setRevealed(true)}>Покажи отговор</CheckBtn> : <p className="font-mono-cal text-xs text-stone-400">Очакван отговор: {q.answer}</p>}
  </QCard>;
}

function OrderQ({q}){
  const [order,setOrder]=useState(()=>{
    const arr=[...(q.items||[])];
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
  });
  const [checked,setChecked]=useState(false);
  function move(i,dir){
    setChecked(false);
    const arr=[...order]; const j=i+dir;
    if(j<0||j>=arr.length)return;
    [arr[i],arr[j]]=[arr[j],arr[i]];
    setOrder(arr);
  }
  const ok = JSON.stringify(order)===JSON.stringify(q.items||[]);
  return <QCard label="Подредба" question={q.question}>
    <div className="space-y-1">
      {order.map((item,i)=>(
        <div key={item+i} className="flex items-center gap-2 px-3 py-2 rounded border border-stone-700 text-sm font-read text-stone-200">
          <span className="flex flex-col gap-0.5 shrink-0">
            <button onClick={()=>move(i,-1)} className="text-stone-500 hover:text-rose-400 leading-none text-xs">▲</button>
            <button onClick={()=>move(i,1)} className="text-stone-500 hover:text-rose-400 leading-none text-xs">▼</button>
          </span>
          {item}
        </div>
      ))}
    </div>
    {!checked ? <CheckBtn onClick={()=>setChecked(true)}/> : <Result ok={ok} text={`Вярна подредба: ${(q.items||[]).join(" → ")}`}/>}
  </QCard>;
}

function MatchQ({q}){
  const pairs=q.pairs||[];
  const rightOptions=pairs.map(p=>p.right);
  const [sel,setSel]=useState(()=>pairs.map(()=>""));
  const [checked,setChecked]=useState(false);
  function setOne(i,val){ setChecked(false); setSel(s=>s.map((v,idx)=>idx===i?val:v)); }
  const ok = pairs.every((p,i)=>sel[i]===p.right);
  return <QCard label="Свързване на двойки" question={q.question}>
    <div className="space-y-2">
      {pairs.map((p,i)=>(
        <div key={i} className="flex items-center gap-2 text-sm">
          <span className="font-read text-stone-200 flex-1">{p.left}</span>
          <select value={sel[i]} onChange={e=>setOne(i,e.target.value)}
            className="bg-stone-900 border border-stone-700 rounded px-2 py-1.5 text-stone-100 font-read text-sm focus:outline-none focus:border-rose-600">
            <option value="">— избери —</option>
            {rightOptions.map((r,j)=><option key={j} value={r}>{r}</option>)}
          </select>
        </div>
      ))}
    </div>
    {!checked ? <CheckBtn onClick={()=>setChecked(true)}/> : <Result ok={ok} text={`Верни двойки: ${pairs.map(p=>`${p.left} — ${p.right}`).join("; ")}`}/>}
  </QCard>;
}

function ConfessionPanel({loading,confession,tuned,onTune}){
  if(loading) return <Spinner label="AI мисли честно за собствените си граници…"/>;
  if(!confession) return null;
  const paragraphs = confession.split(/\n\s*\n/).filter(p=>p.trim());
  return <div className="space-y-4">
    <div className="rounded border border-fuchsia-900/50 bg-fuchsia-950/10 p-4 space-y-3">
      {paragraphs.map((p,i)=>(
        <p key={i} className="font-read text-stone-200 leading-relaxed text-lg italic">{p.trim()}</p>
      ))}
    </div>
    <div><TuneButton tuned={tuned} onClick={onTune}/></div>
  </div>;
}

function CuriosityPanel({loading,questions}){
  if(!questions||!questions.length){
    return <p className="font-read text-stone-500 text-sm py-6">
      Все още нямаш зададени въпроси. Отвори „Общ преглед" и задай въпрос — отговорът ще се появи тук.
    </p>;
  }
  return <div className="space-y-3">
    {questions.map((item,i)=>(
      <div key={item.id||i} className="rounded border border-indigo-900/50 bg-indigo-950/10 p-4">
        <p className="font-read text-stone-100 leading-relaxed text-lg font-medium mb-2">{item.q}</p>
        {item.answered
          ? <p className="font-read text-stone-300 leading-relaxed text-base">{item.answer}</p>
          : <div className="flex items-center gap-2 text-stone-500 text-sm"><Loader2 size={14} className="animate-spin"/><span className="font-mono-cal">генерирам отговор…</span></div>}
      </div>
    ))}
  </div>;
}

/* ── Panels ──────────────────────────────────────────────────────────── */
function LevelsPanel({loading,levels,tuned,onTune,topLevel}){
  if(loading)return <Spinner label="генерирам 5 нива…"/>;
  if(!levels.length)return null;
  return <div className="space-y-4">
    <div className="flex justify-between border-b border-stone-800 pb-2">
      {LEVELS.map(l=>{
        const isTuned=tuned.includes(l.level),isTop=String(l.level)===String(topLevel);
        return <div key={l.level} className="flex flex-col items-center gap-1 flex-1">
          <span className={`font-mono-cal text-xs ${isTuned?"text-amber-500":"text-stone-500"}`}>{l.level}</span>
          <span className={`h-3 w-px ${isTuned?"bg-amber-500":"bg-stone-700"}`}/>
          <span className={`font-mono-cal text-xs uppercase tracking-wide text-center ${isTuned?"text-amber-400":"text-stone-500"}`}>{l.label}</span>
          {isTop&&<span className="text-[10px] text-emerald-500 font-mono-cal">най-добро</span>}
        </div>;
      })}
    </div>
    <div className="space-y-3">
      {levels.map(lv=>{
        const meta=LEVELS.find(l=>l.level===lv.level),isTuned=tuned.includes(lv.level);
        return <div key={lv.level} className={`rounded border p-4 ${isTuned?"border-amber-600/50 bg-amber-950/10":"border-stone-800"}`}>
          <div className="font-mono-cal text-xs uppercase tracking-wide text-stone-400 mb-2">Ниво {lv.level} · {meta?.label}</div>
          <p className="font-read text-stone-200 leading-relaxed text-lg">{lv.text}</p>
          <div className="mt-2"><TuneButton tuned={isTuned} onClick={()=>onTune(lv.level)}/></div>
        </div>;
      })}
    </div>
  </div>;
}

function BlendPanel({canBlend,blend,loading,onGenerate,tuned,onTune}){
  if(!canBlend)return <p className="font-read text-stone-500 text-sm py-6">Оцени поне едно ниво от таб Нива — миксът се изгражда на база харесаните обяснения.</p>;
  if(loading)return <Spinner label="смесвам обяснението…"/>;
  if(!blend)return <button onClick={onGenerate} className="flex items-center gap-2 font-mono-cal text-xs uppercase tracking-wide bg-amber-600 hover:bg-amber-500 text-stone-950 font-medium px-4 py-2 rounded"><Sparkles size={16}/> Генерирай микс</button>;
  const lvl=LEVELS.find(l=>l.level===blend.level);
  return <div className={`rounded border p-4 ${tuned?"border-amber-600/50 bg-amber-950/10":"border-stone-800"}`}>
    <div className="font-mono-cal text-xs uppercase tracking-wide text-stone-400 mb-2">Ниво {blend.level} · {lvl?.label}</div>
    <p className="font-read text-stone-200 leading-relaxed text-lg">{blend.text}</p>
    <div className="mt-2"><TuneButton tuned={tuned} onClick={onTune}/></div>
    <p className="font-mono-cal text-[11px] text-stone-600 mt-2">Оценката влияе глобално на алгоритъма.</p>
    <button onClick={onGenerate} className="mt-2 font-mono-cal text-xs text-stone-500 hover:text-amber-400">Генерирай отново</button>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Aperture/>);
</script>
</body>
</html>
