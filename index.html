async function loadJSON(key, fallback) {
  if (USE_LOCAL) { try { const r=localStorage.getItem("aperture:"+key); return r?JSON.parse(r):fallback; } catch{return fallback;} }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`,
      {headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
    if (!res.ok) throw new Error(res.status);
    const rows = await res.json();
    return rows.length>0 ? rows[0].value : fallback;
  } catch { return fallback; }
}
async function saveJSON(key, value) {
  if (USE_LOCAL) { try{localStorage.setItem("aperture:"+key,JSON.stringify(value));return{ok:true};}catch(e){return{ok:false,detail:e.message};} }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?on_conflict=key`,{
      method:"POST",

      body:JSON.stringify({key,value})

}

/* ── Claude API ──────────────────────────────────────────────────────── */
async function callClaude(user, maxTokens=600, attempt=0) {
  let res;
  try {
    res = await fetch(CLAUDE_PROXY,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_KEY}`},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:maxTokens,messages:[{role:"user",content:`${JSON_SYS}\n\n${user}`}]})});
  } catch(e) {
    if(attempt<3){await sleep(700*(attempt+1));return callClaude(user,maxTokens,attempt+1);}
    throw new Error(`[fetch] ${e.message}`);
  }
  if(res.status===429&&attempt<3){await sleep(1500*(attempt+1));return callClaude(user,maxTokens,attempt+1);}
  let data;
  try{data=await res.json();}catch(e){
    if(attempt<3){await sleep(700*(attempt+1));return callClaude(user,maxTokens,attempt+1);}
    throw new Error(`[parse] ${e.message}`);
  }
  if(!res.ok) throw new Error(`[http] ${res.status}: ${JSON.stringify(data).slice(0,150)}`);
  if(!data?.content) throw new Error(`[shape] ${JSON.stringify(data).slice(0,100)}`);
  const text=data.content.map(b=>b.text||"").join("\n");
  let clean=text.replace(/```json/gi,"").replace(/```/g,"").trim();
  const fi=clean.indexOf("{"),la=clean.lastIndexOf("}");
  if(fi!==-1&&la>fi)clean=clean.slice(fi,la+1);
  try{return JSON.parse(clean);}catch(e){throw new Error(`[json] ${e.message} | raw=${text.slice(0,100)}`);}
}

  const levelDescs = LEVELS.map(m=>`Level ${m.level} ("${m.label}", ${m.hint})`).join("; ");
  const raw = await callClaudeRaw(
    `Topic: "${topic}" > "${sub}" > "${subsub}".
Write 5 explanations of this, one for each level below, EACH ${lo}-${hi} words:
${levelDescs}
Any example or analogy you use must fit strictly within the exact context/scenario given above — never substitute a different generic scenario. Each level should be genuinely distinct in register/depth from the others, not a reworded repeat.
Write all 5 in the SAME language as the topic chain above (detect it and match exactly — if written in Cyrillic script, that means BULGARIAN specifically, never Russian or any other Cyrillic language; if written in Latin script, that means ENGLISH specifically).
Never use the " character inside the text.
Output EXACTLY in this format, nothing before the first marker or after the last one, no extra commentary:
###L1### level 1 text ###L2### level 2 text ###L3### level 3 text ###L4### level 4 text ###L5### level 5 text ###END###`,
    Math.min(3800, 400+hi*5*3)
  );
  const fields = extractSequentialFields(raw, ["L1","L2","L3","L4","L5"]);
  return LEVELS.map(m=>({level:m.level, text:fields[`L${m.level}`]||""}));
}

// Речник: ONE explanation per term, all in a single request, at the subtopic's chosen abstraction level
// (see AUTO_SELECT_LEVEL config) — replaces browsing all 5 abstraction levels per term.
async function genGlossary(topicLabel, subtopicName, termNames, levelHint) {
  const lvl = levelHint?.level||3;
  const meta = LEVELS.find(l=>l.level===lvl) || LEVELS[2];
  // fixed per-level targets: level1 = 2-3 sentences just to orient; level3 = ~10-15 sec read (~40-55 words)
  const ranges = {1:[15,25], 2:[25,40], 3:[40,55], 4:[55,75], 5:[75,100]};
  const [lo,hi] = ranges[lvl]||ranges[3];
  const fieldNames = termNames.map((_,i)=>`T${i+1}`);
  const markerLines = termNames.map((t,i)=>`###T${i+1}### explanation of "${t}"`).join(" ");
  const raw = await callClaudeRaw(
    `Topic: "${topicLabel}" > "${subtopicName}". Write ONE VERY SHORT explanation for EACH of these ${termNames.length} terms, each STRICTLY ${lo}-${hi} words (this is a hard limit — count your words, this must be brief, just enough to orient, not a full explanation), all at level "${meta.label}" (${meta.hint}) — this is the depth/register the learner already chose for this subtopic.
Terms, in order: ${termNames.map((t,i)=>`${i+1}. ${t}`).join("; ")}.
Any example or analogy you use must fit strictly within the exact context/scenario given above — never substitute a different generic scenario. Write all explanations in the SAME language as the topic/subtopic above (detect it and match exactly — if written in Cyrillic script, that means BULGARIAN specifically, never Russian or any other Cyrillic language; if written in Latin script, that means ENGLISH specifically).
Never use the " character inside the text.
Output EXACTLY in this format, nothing before the first marker or after the last one, no extra commentary:
${markerLines} ###END###`,
    Math.min(3800, 300+hi*termNames.length*2)
  );
  const fields = extractSequentialFields(raw, fieldNames);
  const cap = Math.round(hi*1.3); // hard ceiling with a little slack, enforced regardless of model compliance
  return termNames.map((t,i)=>({name:t, text:truncateWords(fields[`T${i+1}`]||"", cap)}));
}
function truncateWords(text, maxWords){
  const words = (text||"").trim().split(/\s+/).filter(Boolean);
  if(words.length<=maxWords) return (text||"").trim();
  return words.slice(0,maxWords).join(" ").replace(/[,;:—-]+$/,"") + "…";
}

    for(const subsub of list){
      const name=subName(subsub);
      allUnitKeys.push({key:`${slugify(sub.name)}/${slugify(name)}`, label:`${sub.name} › ${name}`});
    }
  }

  for(const [key,nd] of Object.entries(nodeDataMap)){
    const unit=key.split("/").slice(1).join(" › ");
    const tunedLevels = nd.tunedAbstraction||[];
    const hasAnyRating = tunedLevels.length>0 || !!nd.tunedBlendKey;
    if(nd.unitConfused) confused.push(unit);
    if(tunedLevels.length>0 && !nd.unitConfused){
      const maxLevel = Math.max(...tunedLevels);
      if(maxLevel<=2){ improveUnits.push(unit); lowLevelSum+=maxLevel; lowLevelCount++; }
      else { solidUnits.push(unit); } // level 3+ counts as adequately/solidly understood
    }
    // opened but never rated and never marked confused = disengaged
    if(!hasAnyRating && !nd.unitConfused) ignoredUnits.push(unit);
  }
  // units never even opened also count as disengaged (bug fix: match slugified keys)
  const openedRelKeys = new Set(Object.keys(nodeDataMap).map(k=>k.split("/").slice(1).join("/")));
  for(const u of allUnitKeys){
    if(!openedRelKeys.has(u.key)) ignoredUnits.push(u.label);
  }

  const avgLowLevel = lowLevelCount>0 ? Math.round(lowLevelSum/lowLevelCount) : null;
  const topLvl=LEVELS.find(l=>l.level===Number(topPreferred(prefs.abstraction,null)))?.label;
  const raw=await callClaudeRaw(
    `Learner studying "${topic}". Subtopics: ${hierarchy.map(s=>s.name).join(", ")}.
Understood adequately or solidly (level 3+ explanations liked — "Mechanics", "Definition", or "Depth"): ${solidUnits.join(", ")||"none yet"}.
Marked as completely unclear: ${confused.join(", ")||"none"}.
Understood only at a shallow level (only liked "Analogy" or "Example" explanations, levels 1-2 — this is INSUFFICIENT depth, not real command of the topic): ${improveUnits.join(", ")||"none"}.
Never engaged with — no level rated, no "did not understand" mark, not opened (likely low interest, not a knowledge gap): ${ignoredUnits.join(", ")||"none"}.
Preferred explanation level overall: "${topLvl||"unknown"}".
Write in the SAME language as the topic above (detect it and match exactly — if written in Cyrillic script, that means BULGARIAN specifically, never Russian or any other Cyrillic language; if written in Latin script, that means ENGLISH specifically). Use an OBJECTIVE, calibrated, non-flattering tone throughout — this is a factual assessment, not encouragement. Do not use inflated praise language (avoid phrases like "solid foundation", "great grasp", "well done") for anything below level 3. Be precise about what each level of understanding actually means: level 1-2 (analogy/example only) = superficial, not yet real understanding; level 3 (mechanics) = adequate, functional understanding; level 4-5 (definition/depth) = solid, strong command.
Output EXACTLY five sections using these markers, nothing before the first marker or after the last one, no extra commentary:
###KNOWS### (80-120 words) — objectively state what is adequately or solidly understood (from the level 3+ list only); if that list is empty, say plainly that nothing has reached an adequate depth yet, without softening it
###IMPROVE### (60-100 words) — ONLY about the shallow-understanding units listed above: name them and state plainly that only surface-level analogy/example understanding exists, then explain what deeper understanding is still missing for each; if empty, say there's nothing at this shallow tier
###MISSING### (100-140 words) — what's missing entirely, including confused units and missing foundational knowledge
###IGNORED### (50-90 words) — about the never-engaged units listed above: note plainly these appear low-interest rather than a knowledge gap, and future plans will deprioritize similar content; if empty, say everything has been engaged with
###NEXT### (40-70 words) — ONE concrete next step focused on making unclear material actually click and reinforcing what's already understood. Prioritize in this order: (a) if there are confused units, suggest revisiting one of them with a genuinely different explanation approach (a different angle, simpler language, or filling a likely missing prerequisite concept) — do NOT suggest simply moving to new/harder material; (b) if no confused units but shallow-understanding units exist, suggest deepening ONE of those at a similar or only slightly higher level, not a big jump; (c) only if everything so far is solid, suggest a genuinely new next topic. The goal is comprehension and consolidation, never difficulty escalation for its own sake.
###END###`,
    1500
  );
  const fields = extractSequentialFields(raw, ["KNOWS","IMPROVE","MISSING","IGNORED","NEXT"]);
  return {
    knows: fields.KNOWS, improve: fields.IMPROVE, missing: fields.MISSING, ignored: fields.IGNORED, next: fields.NEXT,
    _improveUnits: improveUnits, _avgLowLevel: avgLowLevel, _ignoredUnits: ignoredUnits
  };
}

// raw text call (no JSON) — safer for long prose that may contain quotes/punctuation
async function callClaudeRaw(user, maxTokens=1500, attempt=0, cap=4000) {
  let res;
  try {
    res = await fetch(CLAUDE_PROXY,{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_KEY}`},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:maxTokens,messages:[{role:"user",content:user}]})});
  } catch(e) {
    if(attempt<3){await sleep(700*(attempt+1));return callClaudeRaw(user,maxTokens,attempt+1,cap);}
    throw new Error(`[fetch] ${e.message}`);
  }
  if(res.status===429&&attempt<3){await sleep(1500*(attempt+1));return callClaudeRaw(user,maxTokens,attempt+1,cap);}
  let data;
  try{data=await res.json();}catch(e){
    if(attempt<3){await sleep(700*(attempt+1));return callClaudeRaw(user,maxTokens,attempt+1,cap);}
    throw new Error(`[parse] ${e.message}`);
  }
  if(!res.ok) throw new Error(`[http] ${res.status}: ${JSON.stringify(data).slice(0,150)}`);
  if(!data?.content) throw new Error(`[shape] ${JSON.stringify(data).slice(0,100)}`);
  if(data.stop_reason==="max_tokens" && attempt<3 && maxTokens<cap){
    return callClaudeRaw(user, Math.min(cap, maxTokens*2), attempt+1, cap);
  }
  return data.content.map(b=>b.text||"").join("\n").trim();
}
function extractField(raw, name){
  const start=`###${name}###`, end=`###${name}_END###`;
  const si=raw.indexOf(start);
  if(si===-1) return raw.trim();
  const from=si+start.length;
  const ei=raw.indexOf(end, from);
  return (ei===-1 ? raw.slice(from) : raw.slice(from,ei)).trim();
}
// extract multiple SEQUENTIAL fields (###NAME1### text ###NAME2### text ... ###END###) — no per-field _END markers
function extractSequentialFields(raw, names){
  const positions = names.map(n=>({n, pos:raw.indexOf(`###${n}###`)}));
  const result={};
  for(let i=0;i<positions.length;i++){
    const {n,pos}=positions[i];
    if(pos===-1){ result[n]=""; continue; }
    const start = pos + `###${n}###`.length;
    let end = raw.indexOf("###END###", start);
    for(let j=i+1;j<positions.length;j++){
      if(positions[j].pos!==-1 && positions[j].pos>start){
        end = end===-1 ? positions[j].pos : Math.min(end, positions[j].pos);
        break;
      }
    }
    result[n] = (end===-1 ? raw.slice(start) : raw.slice(start,end)).trim();
  }
  return result;
}

// algorithm below, reused for every crossword regardless of topic/level — never AI-generated, never re-invented.
async function genCrosswordWords(topicLabel, subtopicName, levelHint) {
  const lvl = levelHint?.level||3;
  const count = lvl<=1?"5-6":lvl===2?"6-8":lvl===3?"8-10":lvl===4?"10-12":"12-15";
  const levelPart = levelHint ? ` Match the depth/register the learner chose: "${levelHint.label}" (${levelHint.hint}).` : "";
  const raw = await callClaudeRaw(
    `Generate ${count} single WORDS (no spaces, no punctuation, no numbers, one token each) with short clues, all genuinely related to "${subtopicName}" (within the broader context of "${topicLabel}"), suitable for a crossword puzzle.${levelPart}
Each word must be a real term/name/concept from this exact subject — vary word length for a good mix (some short 3-5 letters, some longer 6-10 letters). Each clue is a short hint (under 12 words) that leads to that exact word without giving it away directly.
Write words and clues in the SAME language as the topic/subtopic above (if Cyrillic, that means BULGARIAN specifically, never Russian; if Latin, that means ENGLISH specifically) — words must be single tokens with no spaces (for compound terms, pick the single most essential word).
Never use the " character inside the text.
Output as blocks separated by a blank line, each block being exactly 2 lines: the word, then the clue. Nothing else before or after.
Output ONLY this list, wrapped exactly like this and nothing else before or after: ###TEXT###the words here###TEXT_END###`,
    1800
  );
  const raw2 = extractField(raw, "TEXT");
  return raw2.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).map(b=>{
    const lines = b.split("\n").map(l=>l.trim()).filter(Boolean);
    return { word:lines[0]||"", clue:lines[1]||"" };
  }).filter(w=>w.word && w.clue);
}

function normalizeXWord(w){ return (w||"").toUpperCase().replace(/[^A-ZА-Я]/g,""); }

// deterministic greedy crossword layout — always produces a valid, self-consistent grid; words that
// genuinely can't be placed (no valid crossing found) are simply skipped rather than corrupting the grid
function buildCrossword(wordList){
  const words = wordList
    .map(w=>({ word:normalizeXWord(w.word), clue:w.clue }))
    .filter(w=>w.word.length>=3)
    .sort((a,b)=>b.word.length-a.word.length);
  if(!words.length) return null;

  const SIZE = 25;
  const CENTER = Math.floor(SIZE/2);
  const grid = Array.from({length:SIZE},()=>Array(SIZE).fill(null));
  const placed = [];

  function canPlace(word,row,col,dir){
    for(let i=0;i<word.length;i++){
      const r = dir==="down" ? row+i : row;
      const c = dir==="across" ? col+i : col;
      if(r<0||r>=SIZE||c<0||c>=SIZE) return false;
      const existing = grid[r][c];
      if(existing && existing!==word[i]) return false;
    }
    if(dir==="across"){
      if(col-1>=0 && grid[row][col-1]) return false;
      if(col+word.length<SIZE && grid[row][col+word.length]) return false;
    }else{
      if(row-1>=0 && grid[row-1][col]) return false;
      if(row+word.length<SIZE && grid[row+word.length][col]) return false;
    }
    return true;
  }
  function place(word,row,col,dir){
    for(let i=0;i<word.length;i++){
      const r = dir==="down" ? row+i : row;
      const c = dir==="across" ? col+i : col;
      grid[r][c]=word[i];
    }
  }

  const first = words[0];
  const startCol = CENTER - Math.floor(first.word.length/2);
  place(first.word, CENTER, startCol, "across");
  placed.push({...first, row:CENTER, col:startCol, dir:"across"});

  for(let idx=1; idx<words.length; idx++){
    const w = words[idx];
    let best = null;
    outer:
    for(const pw of placed){
      for(let i=0;i<w.word.length;i++){
        for(let j=0;j<pw.word.length;j++){
          if(w.word[i]!==pw.word[j]) continue;
          const dir = pw.dir==="across" ? "down" : "across";
          const row = dir==="down" ? pw.row-i : pw.row+j;
          const col = dir==="down" ? pw.col+j : pw.col-i;
          if(canPlace(w.word,row,col,dir)){ best={row,col,dir}; break outer; }
        }
      }
    }
    if(best){ place(w.word,best.row,best.col,best.dir); placed.push({...w,...best}); }
  }

  let minR=SIZE,maxR=0,minC=SIZE,maxC=0;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(grid[r][c]){ minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c); }
  const trimmed=[];
  for(let r=minR;r<=maxR;r++){ const row=[]; for(let c=minC;c<=maxC;c++) row.push(grid[r][c]); trimmed.push(row); }
  const adjPlaced = placed.map(p=>({...p, row:p.row-minR, col:p.col-minC}));

  const rows=trimmed.length, cols=trimmed[0].length;
  const numGrid = Array.from({length:rows},()=>Array(cols).fill(null));
  let num=1;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(!trimmed[r][c]) continue;
    const startsAcross = (c===0||!trimmed[r][c-1]) && c+1<cols && trimmed[r][c+1];
    const startsDown = (r===0||!trimmed[r-1][c]) && r+1<rows && trimmed[r+1][c];
    if(startsAcross||startsDown) numGrid[r][c]=num++;
  }
  const numbered = adjPlaced.map(p=>({...p, number:numGrid[p.row][p.col]}));
  return { grid:trimmed, words:numbered, rows, cols };
}

function itemCountForLevel(level){
  return {1:3,2:4,3:5,4:5,5:5}[level]||5;
}

// Rework: N unconventional approaches (N scales with level) — simplest starting point -> full realization/mastery
async function genActionPlan(topicLabel, subtopicName, levelHint) {
  const lvl = levelHint?.level||3;
  const n = itemCountForLevel(lvl);
  const totalWords = Math.max(75, wb(lvl,0.15));
  const perIdea = Math.round(totalWords/n);
  const lo=Math.max(10,Math.round(perIdea*0.75)), hi=Math.round(perIdea*1.25);
  const levelPart = levelHint ? ` Match the depth/register the learner chose: "${levelHint.label}" (${levelHint.hint}).` : "";
  const fieldNames=[]; const markerLines=[];
  for(let i=1;i<=n;i++){
    fieldNames.push(`S${i}T`,`S${i}B`);
    markerLines.push(`###S${i}T### idea ${i} title ###S${i}B### idea ${i} body`);
  }
  const raw = await callClaudeRaw(
    `Design a "REWORK" — ${n} UNCONVENTIONAL, creative, sometimes experimental approaches to actually getting real results with "${subtopicName}" (within the broader context of "${topicLabel}"), for someone who always looks for a better way, dislikes following the textbook/official docs/standard instructions, and wants more value and efficiency than the conventional path offers.
Each idea must genuinely challenge or break from the standard/expected way of learning or doing this — a shortcut most people don't know, a contrarian reframing, an unusual technique borrowed from elsewhere, or an experimental method worth trying — never generic "think outside the box" fluff, always something specific and actually usable tied to this exact subject.
Escalate boldness across the ${n}: idea 1 is a simple but non-obvious tweak or hack usable right away; the last idea is a genuinely radical rethink of the standard approach to "${subtopicName}" entirely.${levelPart}
For each idea, give a SHORT punchy title (3-7 words, provocative or memorable — never a generic label like "Idea 1") and a body of ${lo}-${hi} words explaining the idea and specifically why/how it beats the conventional approach.
Write in the SAME language as the topic/subtopic above (detect it and match exactly — if written in Cyrillic script, that means BULGARIAN specifically, never Russian or any other Cyrillic language; if written in Latin script, that means ENGLISH specifically).
Never use the " character inside the text.
Output EXACTLY in this format, nothing before the first marker or after the last one, no extra commentary:
${markerLines.join(" ")} ###END###`,
    600+n*500
  );
  const fields = extractSequentialFields(raw, fieldNames);
  const arr=[];
  for(let i=1;i<=n;i++) arr.push({title:fields[`S${i}T`]||`Идея ${i}`, body:fields[`S${i}B`]||""});
  return arr;
}

// Socratic-style dialogue: N guiding questions (N scales with level), not direct exposition
async function genSocraticDialogue(topicLabel, subtopicName, levelHint) {
  const lvl = levelHint?.level||3;
  const n = itemCountForLevel(lvl);
  const totalWords = Math.max(60, wb(lvl,0.12));
  const perNote = Math.round(totalWords/n);
  const lo=Math.max(6,Math.round(perNote*0.7)), hi=Math.round(perNote*1.3);
  const levelPart = levelHint ? ` Match the depth/register the learner chose: "${levelHint.label}" (${levelHint.hint}).` : "";
  const fieldNames=[]; const markerLines=[];
  for(let i=1;i<=n;i++){
    fieldNames.push(`Q${i}`,`G${i}`);
    markerLines.push(`###Q${i}### question ${i} ###G${i}### guiding note ${i}${i===n?" (synthesis)":""}`);
  }
  const raw = await callClaudeRaw(
    `Design a SOCRATIC dialogue teaching "${subtopicName}" (within the broader context of "${topicLabel}") — a sequence of exactly ${n} guiding QUESTIONS, in the true Socratic method: each question should provoke the learner to think and arrive at the insight themselves, rather than being told the answer directly. Questions should build on each other, moving from a simple provocation toward the core understanding. Do NOT just ask generic quiz questions — each should genuinely guide reasoning toward the next realization, the way a real Socratic teacher would. Keep each question itself short (one sentence).
For each question, also give a short GUIDING NOTE (${lo}-${hi} words) — not the direct answer, but a nudge, a related observation, or a follow-up prompt that helps the learner think it through, IN THE STYLE of a teacher gently redirecting without lecturing. Only the FINAL guiding note may synthesize/confirm the core insight, since it concludes the dialogue.
Ground every question in the exact subject matter of "${subtopicName}" — never generic philosophical questions unrelated to the actual content.${levelPart}
Write in the SAME language as the topic/subtopic above (detect it and match exactly — if written in Cyrillic script, that means BULGARIAN specifically, never Russian or any other Cyrillic language; if written in Latin script, that means ENGLISH specifically).
Never use the " character inside the text.
Output EXACTLY in this format, nothing before the first marker or after the last one, no extra commentary:
${markerLines.join(" ")} ###END###`,
    600+n*500
  );
  const fields = extractSequentialFields(raw, fieldNames);
  const arr=[];
  for(let i=1;i<=n;i++) arr.push({question:fields[`Q${i}`]||"", guidance:fields[`G${i}`]||""});
  return arr;
}

// Тест: one question of each of 6 types, tied to the exact subtopic content
// self-contained interactive HTML/CSS/JS widget illustrating the key relationships/parameters of the subtopic
async function genSimulation(topicLabel, subtopicName, levelHint) {
  const levelPart = levelHint ? ` Match the depth/register the learner chose: "${levelHint.label}" (${levelHint.hint}) — simpler interaction with fewer variables for lower levels, richer/more nuanced for higher levels.` : "";
  const raw = await callClaudeRaw(
    `Design a SELF-CONTAINED, fully interactive HTML simulation/widget that helps understand "${subtopicName}" (within the broader context of "${topicLabel}") by letting the learner manipulate key variables/parameters and immediately SEE the effect — teaching through direct interaction, not reading.
Pick whatever interaction style is most natural and illuminating for this SPECIFIC subject: e.g. a mock chat interface with pre-scripted canned responses that change based on a toggled parameter (like a simulated rate limiter, a missing token, a malformed prompt); a calculator with sliders/buttons for the relevant variables plus a live-updating chart/graph/table showing how they interact; an animated analogy (a car whose speed changes a visual, a TV changing channels) whose state responds to controls. The core idea: reveal the RELATIONSHIPS between the actual parameters/concepts of "${subtopicName}", using entirely pre-scripted/simulated logic — NOT a real working backend, NOT real API calls, just JavaScript that mimics plausible behavior for teaching purposes.${levelPart}
Requirements:
- Output ONE complete, self-contained HTML document: <!DOCTYPE html><html><head><style>...</style></head><body>...<script>...<${""}/script></body></html>
- No external resources whatsoever (no CDN links, no external images/fonts, no network calls) — pure inline HTML/CSS/JS only, so it works fully offline inside a sandboxed iframe.
- CRITICAL — event handling: NEVER use inline HTML event attributes like onclick="..." or onchange="...". ALWAYS attach event listeners from JavaScript using addEventListener, after querying the elements (e.g. document.getElementById(...).addEventListener('click', fn)). Put all JavaScript in one <script> block at the end of <body>, after the elements it references already exist in the HTML above it — this guarantees the handlers actually work inside a sandboxed iframe.
- CRITICAL — no scrolling: the widget must fit entirely within the viewport with NO scrollbars. Set html, body { margin:0; padding:0; height:100%; overflow:hidden; box-sizing:border-box } and apply box-sizing:border-box to all elements. Design the layout (font sizes, spacing, number of visible rows/controls) so everything fits within roughly 460px of height without needing to scroll — favor a compact, single-screen layout over a tall one.
- Dark-friendly styling that looks clean and modern (the surrounding app is dark-themed) — use a dark or neutral background, readable light text, decent spacing and rounded corners; feel free to use inline SVG or <canvas> for any chart/graph/visual.
- Must be genuinely interactive (respond to clicks/input/sliders in real time via JavaScript) and directly illustrate the specific relationships/parameters of "${subtopicName}" — never a generic unrelated demo.
- CRITICAL — the relationship must be EXPLAINED, not just shown: the widget's PRIMARY teaching goal is making the learner understand WHY the output changes, not just that it changes. In addition to any chart/visual, include a short text area (1-3 sentences) that updates live with the current control values and states IN PLAIN WORDS what is happening and why — e.g. "При 4 тенанта × 2 workers всеки = 8 pods общо; на 300 jobs в опашката всеки pod обработва ~37 jobs, затова изчакването расте." Reference the actual current numbers from the controls in this sentence every time it updates. If there's a simple underlying formula or rule, show it once, visibly, near the controls (e.g. "Pods = тенанти × workers/тенант") so the cause-effect is explicit, not something the learner has to reverse-engineer from a chart alone.
- STRICT SCOPE LIMIT: at most 2 interactive controls total (sliders/toggles/buttons combined), ONE visualization area (a chart, a mock chat log, an animated graphic, or a small table), and the one live-updating explanation text described above — nothing else (no extra stat cards, no extra panels). Prioritize making the 2 controls' effect crystal clear over adding more controls. This is a hard limit to keep the code short enough to generate completely and reliably.
- All visible text/labels in the widget in the SAME language as the topic/subtopic above (if Cyrillic, that means BULGARIAN specifically, never Russian; if Latin, that means ENGLISH specifically).
Never use the exact sequence "###" anywhere in the code.
Output ONLY the HTML document, wrapped exactly like this and nothing else before or after: ###HTML###the complete html document here###HTML_END###`,
    3200, 0, 7000
  );
  return extractField(raw, "HTML");
}

async function genTestQuestions(topicLabel, subtopicName, levelHint) {
  const lvl = levelHint?.level||3;
  const tc = testCounts(lvl);
  const levelPart = levelHint ? ` Match the depth/register the learner chose: "${levelHint.label}" (${levelHint.hint}) — keep question text short and simple at lower levels, more nuanced at higher levels.` : "";
  const raw = await callClaudeRaw(
    `Design a small TEST about "${subtopicName}" (within the broader context of "${topicLabel}") with exactly 6 questions, one of each type below. Ground every question strictly in the actual content of "${subtopicName}" — never generic trivia unrelated to it. Keep each question text itself short (one sentence where possible).${levelPart}
Write everything in the SAME language as the topic/subtopic above (detect it and match exactly — if written in Cyrillic script, that means BULGARIAN specifically, never Russian or any other Cyrillic language; if written in Latin script, that means ENGLISH specifically). Never use the " character inside any text. Use " || " as separator between list items, and " :: " between a matched pair's two sides — never use either separator inside the item text itself, and never use the literal string "###" inside any answer text.

1. SINGLE-CHOICE: one question, exactly ${tc.singleOpts} options (only one correct).
2. MULTI-CHOICE: one question, exactly ${tc.multiOpts} options (2 or more correct).
3. FILL-IN-THE-BLANK: one sentence with a blank shown as ___ , plus the correct missing word/phrase.
4. FREE-TEXT/NUMBER: one short-answer question (a fact, a number, a term) plus the expected answer.
5. ORDERING: one question asking to order exactly ${tc.orderItems} items correctly (steps, chronology, size, etc) — give the items in their CORRECT order.
6. MATCHING: one question asking to match exactly ${tc.matchPairs} pairs of related items — give the pairs.

Output the 14 fields below IN THIS EXACT ORDER, each starting with its marker, nothing before the first marker or after the final ###END###:
###Q1### (single-choice question text)
###Q1OPTS### (${tc.singleOpts} options separated by " || ")
###Q1CORRECT### (correct option number, 1-${tc.singleOpts})
###Q2### (multi-choice question text)
###Q2OPTS### (${tc.multiOpts} options separated by " || ")
###Q2CORRECT### (correct option numbers comma-separated, e.g. 1,3)
###Q3### (fill-in-the-blank sentence with ___ as the blank)
###Q3ANSWER### (correct word or phrase)
###Q4### (free-text or number question)
###Q4ANSWER### (expected answer)
###Q5### (ordering question instruction)
###Q5ITEMS### (${tc.orderItems} items separated by " || ", in CORRECT order)
###Q6### (matching question instruction)
###Q6PAIRS### (${tc.matchPairs} pairs as "left :: right" separated by " || ")
###END###`,
    2800
  );
  const fieldNames = ["Q1","Q1OPTS","Q1CORRECT","Q2","Q2OPTS","Q2CORRECT","Q3","Q3ANSWER","Q4","Q4ANSWER","Q5","Q5ITEMS","Q6","Q6PAIRS"];
  const f = extractSequentialFields(raw, fieldNames);

  const num=(s,fb)=>{const n=parseInt((s||"").trim(),10);return isNaN(n)?fb:n;};
  const splitList=s=>(s||"").split("||").map(x=>x.trim()).filter(Boolean);

  const q1opts = splitList(f.Q1OPTS);
  const q2opts = splitList(f.Q2OPTS);
  const q2correctRaw = (f.Q2CORRECT||"").split(",").map(x=>num(x,1)-1).filter(n=>n>=0);
  const q5items = splitList(f.Q5ITEMS);
  const q6pairs = splitList(f.Q6PAIRS).map(p=>{
    const [l,r]=p.split("::").map(x=>(x||"").trim());
    return {left:l||"", right:r||""};
  });

  return [
    { type:"single", question:f.Q1, options:q1opts, correctIndex:num(f.Q1CORRECT,1)-1 },
    { type:"multi", question:f.Q2, options:q2opts, correctIndices:q2correctRaw },
    { type:"fill", question:f.Q3, answer:f.Q3ANSWER },
    { type:"free", question:f.Q4, answer:f.Q4ANSWER },
    { type:"order", question:f.Q5, items:q5items },
    { type:"match", question:f.Q6, pairs:q6pairs },
  ];
}

// T.7 updated: all active topics = interest; high engagement = priority
async function genLearningProfile(topics, nodeDataMap) {
  const allTopics = topics.filter(t=>!t.deletedAt);
  const deleted   = topics.filter(t=>t.deletedAt).map(t=>t.name||t.prompt).filter(Boolean);
  if(!allTopics.length&&!deleted.length) return null;

  // score each active topic by engagement
  const scored = allTopics.map(t=>{
    const keys=Object.keys(nodeDataMap).filter(k=>k.startsWith(t.id+"/"));
    const likes=keys.reduce((s,k)=>(s+(nodeDataMap[k]?.tunedAbstraction?.length||0)+(nodeDataMap[k]?.tunedBlendKey?1:0)),0);
    const confused=keys.filter(k=>nodeDataMap[k]?.unitConfused).length;
    return {name:t.name||t.prompt, likes, confused, hasActivity:likes>0||confused>0};
  });

  const priority   = scored.filter(t=>t.likes>=3).map(t=>t.name);
  const interested = scored.filter(t=>t.likes>0&&t.likes<3).map(t=>t.name);
  const passive    = scored.filter(t=>!t.hasActivity).map(t=>t.name);

  const raw = await callClaudeRaw(
    `A learner uses a study app. Analyze their learning preferences to guide future curriculum generation.
Priority topics (high engagement, many likes): ${priority.join(", ")||"none"}.
Interested topics (some activity): ${interested.join(", ")||"none"}.
Passive topics (saved but not yet studied): ${passive.join(", ")||"none"}.
Archived/deleted topics (did not find value): ${deleted.join(", ")||"none"}.
In 2-3 sentences, describe what kind of learning structure, depth, and content areas this person prefers. Be specific and actionable for a curriculum designer.
Output ONLY the profile text, wrapped exactly like this and nothing else: ###PROFILE###the profile text here###PROFILE_END###`,
    400
  );
  return extractField(raw,"PROFILE") || null;
}

function isQuotesItem(item){ return typeof item==="object" && item!==null && !!item.isQuotes; }
function isBibleItem(item){ return typeof item==="object" && item!==null && !!item.isBible; }
function isGamesItem(item){ return typeof item==="object" && item!==null && !!item.isGames; }
function isActionPlanItem(item){ return typeof item==="object" && item!==null && !!item.isActionPlan; }
function isSocraticItem(item){ return typeof item==="object" && item!==null && !!item.isSocratic; }
function isTestItem(item){ return typeof item==="object" && item!==null && !!item.isTest; }
function isSimulationItem(item){ return typeof item==="object" && item!==null && !!item.isSimulation; }
function isGlossaryItem(item){ return typeof item==="object" && item!==null && !!item.isGlossary; }
function isPrefaceItem(item){ return typeof item==="object" && item!==null && !!item.isPreface; }
function isTrailerItem(item){ return typeof item==="object" && item!==null && !!item.isTrailer; }
function isNextItem(item){ return typeof item==="object" && item!==null && !!item.isNext; }
function isConfessionItem(item){ return typeof item==="object" && item!==null && !!item.isConfession; }
function isHumorItem(item){ return typeof item==="object" && item!==null && !!item.isHumor; }
function isCuriousItem(item){ return typeof item==="object" && item!==null && !!item.isCurious; }
function getSubsubList(subItem){ return (subItem?.activeLevel!=null && subItem?.byLevel) ? (subItem.byLevel[subItem.activeLevel]||null) : null; }
function getDisplayList(subItem){
  const base = getSubsubList(subItem) || [];
  if(subItem?.curiosityQuestions?.length){
    return [...base, { name:"Любопитно", isCurious:true }];
  }
  return base;
}
function regularUnitCount(subsubList){
  return (subsubList||[]).filter(it=>
    !isOverviewItem(it)&&!isExamplesItem(it)&&!isActionPlanItem(it)&&
    !isSocraticItem(it)&&!isTestItem(it)&&!isConfessionItem(it)&&!isCuriousItem(it)
  ).length || 1;
}

function topicLabel(t){
  if(!t) return "(без заглавие)";
  const candidates=[t.name,t.title,t.prompt,t.topic,t.text,t.query];
  for(const c of candidates){ if(typeof c==="string" && c.trim().length>0) return c.trim(); }
  return t.id ? `План ${t.id.slice(0,8)}` : "(без заглавие)";
}
function Spinner({label}){return <div className="flex items-center gap-2 text-stone-400 text-sm py-6 justify-center"><Loader2 size={16} className="animate-spin"/><span className="font-mono-cal">{label}</span></div>;}
function ErrorNote({message,onRetry}){return <div className="border border-red-900/50 bg-red-950/30 rounded p-3 text-sm text-red-200 flex items-center justify-between gap-3"><span className="break-all">{message}</span>{onRetry&&<button onClick={onRetry} className="text-amber-400 hover:text-amber-300 font-mono-cal text-xs shrink-0">Retry</button>}</div>;}
function TuneButton({tuned,onClick}){return <button onClick={onClick} disabled={tuned} className={`font-mono-cal text-xs uppercase tracking-wide px-3 py-1.5 rounded border transition-colors ${tuned?"border-amber-600/40 text-amber-500 bg-amber-950/30 cursor-default":"border-stone-600 text-stone-300 hover:border-amber-500 hover:text-amber-400"}`}>{tuned?"Харесва ✓":"Харесвам"}</button>;}

function OverviewPicker({title,levels,loading,error,onPick,picking,onBack,existingLevels}){
  return <div className="space-y-4">
    {onBack && <button onClick={onBack} className="flex items-center gap-1 text-stone-500 hover:text-stone-300 text-sm font-mono-cal"><ChevronLeft size={16}/> назад</button>}
    <h2 className="font-display text-xl font-bold text-stone-100">{title}</h2>
    <p className="font-read text-stone-400 text-sm">Избери нивото на обяснение, което ти допада — оттам ще изградим темите.</p>
    {loading && <Spinner label="генерирам 5 нива на обяснение…"/>}
    {error && <ErrorNote message={error}/>}
    {!loading && levels.length>0 && (
      <div className="space-y-3">
        {levels.map(lv=>{
          const meta=LEVELS.find(l=>l.level===lv.level);
          const already = existingLevels && existingLevels.includes(lv.level);
          return <div key={lv.level} className={`rounded border p-4 ${already?"border-emerald-800 bg-emerald-950/10":"border-stone-800"}`}>
            <div className="font-mono-cal text-xs uppercase tracking-wide text-stone-400 mb-2 flex items-center gap-2">
              Ниво {lv.level} · {meta?.label}
              {already && <span className="text-[10px] px-1.5 py-0.5 rounded bg-emerald-950/50 text-emerald-500">вече генерирано</span>}
            </div>
            <p className="font-read text-stone-200 leading-relaxed text-lg">{lv.text}</p>
            <button onClick={()=>onPick(lv.level)} disabled={picking}
              className="mt-2 font-mono-cal text-xs uppercase tracking-wide bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-stone-950 font-medium px-3 py-1.5 rounded transition-colors">
              {picking?"…":already?"Отвори тази версия":"Избери това ниво"}
            </button>
          </div>;
        })}
      </div>
    )}
  </div>;
}


function Aperture() {
  const [booting,setBooting]           = useState(true);
  const [storageMode,setStorageMode]   = useState(()=>{try{return localStorage.getItem("aperture:_mode")==="local"?"local":"supabase";}catch{return"local";}});
  const [topics,setTopics]             = useState([]);      // [{id,name,prompt,createdAt,deletedAt?,parentId?,childId?}]
  const [prefs,setPrefs]               = useState({abstraction:{},personality:{}});
  const [topicInput,setTopicInput]     = useState("");
  const [currentTopic,setCurrentTopic] = useState(null);
  const [hierarchy,setHierarchy]       = useState(null);
  const [loadingH,setLoadingH]         = useState(false);
  const [homeError,setHomeError]       = useState(null);
  const [subtopicIdx,setSubtopicIdx]   = useState(null);
  const [subsubIdx,setSubsubIdx]       = useState(null);
  const [nodeId,setNodeId]             = useState(null);
  const [nodeData,setNodeData]         = useState(null);
  const [tab,setTab]                   = useState("levels");
  const [loadingL,setLoadingL]         = useState(false);
  const [loadingB,setLoadingB]         = useState(false);
  const [nodeError,setNodeError]       = useState(null);
  const [levelCheck,setLevelCheck]     = useState(null);
  const [loadingLC,setLoadingLC]       = useState(false);
  const [lcError,setLcError]           = useState(null);
  const [generatingAdapted,setGA]      = useState(false);
  const [generatingAll,setGenAll]      = useState(false);
  const [genAllProgress,setGenAllProgress] = useState("");
  const [genAllError,setGenAllError] = useState(null);
  const [dbTest,setDbTest]             = useState(null);
  const [dbTesting,setDbTesting]       = useState(false);
  const [showTrash,setShowTrash]       = useState(false);
  const [topicOverview,setTopicOverview]       = useState(null); // {loading,levels,prompt,name,id,newTopic,learningProfile,existingPlanData}
  const [subtopicOverview,setSubtopicOverview] = useState(null); // {subIdx,loading,levels,error,confirming}
  const [planData,setPlanData]                 = useState(null); // {name,prompt,overviewLevels,byLevel:{level:subtopicsArr},activeLevel}

  const canBlend = Object.keys(prefs.abstraction||{}).length>0;
  const topLevel = topPreferred(prefs.abstraction,null);
  const activeTopics  = topics.filter(t=>!t.deletedAt);
  const deletedTopics = topics.filter(t=>t.deletedAt);

  useEffect(()=>{
    if(!booting)return;
    (async()=>{
      const t=await loadJSON("topics",[]);
      const p=await loadJSON("prefs",{abstraction:{},personality:{}});
      setTopics(t);setPrefs(p);setBooting(false);
    })();
  },[booting]);

  function toggleStorage(){
    const next=storageMode==="supabase"?"local":"supabase";
    USE_LOCAL=next==="local";
    try{localStorage.setItem("aperture:_mode",next);}catch{}
    setStorageMode(next);
    setTopics([]);setPrefs({abstraction:{},personality:{}});
    setCurrentTopic(null);setHierarchy(null);
    setSubtopicIdx(null);setSubsubIdx(null);
    setNodeId(null);setNodeData(null);setBooting(true);
  }

  function goHome(){
    setCurrentTopic(null);setHierarchy(null);
    setSubtopicIdx(null);setSubsubIdx(null);
    setNodeId(null);setNodeData(null);setLevelCheck(null);
  }

  async function testSupabase(){
    setDbTesting(true);setDbTest(null);
    const wasLocal=USE_LOCAL;USE_LOCAL=false;
    try{
      const r=await saveJSON("_conntest",{ping:Date.now()});
      if(!r.ok){setDbTest(`❌ Запис: ${r.detail}`);return;}
      const rb=await loadJSON("_conntest",null);
      setDbTest(rb?`✅ Supabase работи!`:`⚠️ Запис мина, четене: ${JSON.stringify(rb)}`);
    }catch(e){setDbTest(`❌ ${e.message}`);}
    finally{USE_LOCAL=wasLocal;setDbTesting(false);}
  }

  async function startTopic(prompt) {
    const trimmed=prompt.trim();if(!trimmed)return;
    setHomeError(null);setHierarchy(null);setPlanData(null);
    setSubtopicIdx(null);setSubsubIdx(null);
    setNodeId(null);setNodeData(null);setLevelCheck(null);setTopicInput("");
    setCurrentTopic(null);setSubtopicOverview(null);

    setTopicOverview({loading:true, levels:[], prompt:trimmed});

    // build learning profile for better curriculum
    let learningProfile=null;
    try{
      const allNodeKeys=await loadJSON("allNodeKeys",[]);
      const nodeMap={};
      for(const k of allNodeKeys.slice(0,30)){const nd=await loadJSON(`node:${k}`,null);if(nd)nodeMap[k]=nd;}
      learningProfile=await genLearningProfile(topics,nodeMap);
    }catch(e){console.warn("profile gen failed",e);}

    try{
      const name=await genTopicName(trimmed);
      const id=slugify(trimmed)+"-"+Date.now().toString(36);
      const newTopic={id,name,prompt:trimmed,createdAt:Date.now()};
      setCurrentTopic(newTopic);
      const levels=await genOverviewLevels(trimmed);
      setTopicOverview({loading:false, levels, prompt:trimmed, name, id, newTopic, learningProfile});
    }catch(e){
      setTopicOverview(null);
      setHomeError(`Грешка: ${e.message}`);
    }
  }

  // handles BOTH brand-new topics and revisiting/switching level on an existing topic
  async function confirmTopicLevel(level){
    if(!topicOverview) return;
    const updPrefs={...prefs, abstraction:{...prefs.abstraction,[level]:(prefs.abstraction?.[level]||0)+1}};
    setPrefs(updPrefs); await saveJSON("prefs",updPrefs);

    // CASE 1: switching/revisiting level on an already-created topic
    if(topicOverview.existingPlanData){
      const pd = topicOverview.existingPlanData;
      const id = currentTopic.id;
      if(pd.byLevel[level]){
        // already generated for this level — just switch, no regeneration
        const updated = {...pd, activeLevel:level};
        setPlanData(updated); setHierarchy(updated.byLevel[level]);
        await saveJSON(`plan:${id}`, updated);
        setTopicOverview(null);
        setSubtopicIdx(null); setSubsubIdx(null); setSubtopicOverview(null);
        return;
      }
      setTopicOverview(null);
      setLoadingH(true);
      try{
        const levelMeta = LEVELS.find(l=>l.level===level);
        const names = await genSubtopicNames(pd.prompt, null, levelMeta);
        const trailerName = "Уводен преглед: " + names.slice(0,5).join(", ") + (names.length>5?"…":"");
      const trailerItem = { name:trailerName, isTrailer:true, overviewLevels:null, byLevel:{}, activeLevel:null };
      const subtopics = [trailerItem, ...names.map(n=>({name:n, overviewLevels:null, byLevel:{}, activeLevel:null}))];
        const updated = {...pd, byLevel:{...pd.byLevel, [level]:subtopics}, activeLevel:level};
        setPlanData(updated); setHierarchy(subtopics);
        await saveJSON(`plan:${id}`, updated);
        setSubtopicIdx(null); setSubsubIdx(null); setSubtopicOverview(null);
      }catch(e){setHomeError(`Грешка: ${e.message}`);}
      finally{setLoadingH(false);}
      return;
    }

    // CASE 2: brand-new topic OR resuming an existing topic that has no cached plan yet
    const {prompt,name,id,newTopic,learningProfile,resumingExisting} = topicOverview;
    if(newTopic && !resumingExisting){
      const next=[newTopic,...topics];
      setTopics(next); await saveJSON("topics",next);
    }

    setTopicOverview(null);
    setLoadingH(true);
    try{
      const levelMeta = LEVELS.find(l=>l.level===level);
      const names = await genSubtopicNames(prompt, learningProfile, levelMeta);
      const trailerName = "Уводен преглед: " + names.slice(0,5).join(", ") + (names.length>5?"…":"");
      const trailerItem = { name:trailerName, isTrailer:true, overviewLevels:null, byLevel:{}, activeLevel:null };
      const subtopics = [trailerItem, ...names.map(n=>({name:n, overviewLevels:null, byLevel:{}, activeLevel:null}))];
      const newPlan = {name,prompt,overviewLevels:topicOverview.levels,byLevel:{[level]:subtopics},activeLevel:level};
      setPlanData(newPlan); setHierarchy(subtopics);
      await saveJSON(`plan:${id}`, newPlan);
    }catch(e){setHomeError(`Грешка: ${e.message}`);}
    finally{setLoadingH(false);}
  }

  // reopen the topic-level picker to revisit or switch levels, reusing cached overview texts (no regeneration)
  function openTopicLevelPicker(){
    if(!planData) return;
    if(planData.overviewLevels && planData.overviewLevels.length){
      setTopicOverview({loading:false, levels:planData.overviewLevels, prompt:planData.prompt, name:planData.name, existingPlanData:planData});
      return;
    }
    // legacy plan without cached overview texts — generate them once, then cache
    setTopicOverview({loading:true, levels:[], prompt:planData.prompt, name:planData.name, existingPlanData:planData});
    (async()=>{
      try{
        const levels = await genOverviewLevels(planData.prompt);
        const updated = {...planData, overviewLevels:levels};
        setPlanData(updated);
        await saveJSON(`plan:${currentTopic.id}`, updated);
        setTopicOverview({loading:false, levels, prompt:planData.prompt, name:planData.name, existingPlanData:updated});
      }catch(e){
        setTopicOverview({loading:false, levels:[], prompt:planData.prompt, name:planData.name, existingPlanData:planData, error:`Грешка: ${e.message}`});
      }
    })();
  }

  // best-effort adapter: turn an old-format `hierarchy:${id}` cache into the new byLevel plan shape,
  // preserving whatever was already generated instead of throwing it away
  function migrateLegacyHierarchy(cached){
    const level = cached.chosenLevel || Number(topPreferred(prefs.abstraction,3)) || 3;
    const subtopics = (cached.subtopics||[]).map(s=>{
      const legacyList = s.subsubtopics;
      const hasList = Array.isArray(legacyList) && legacyList.length>0;
      return { name:s.name, overviewLevels:null, byLevel: hasList?{[level]:legacyList}:{}, activeLevel: hasList?level:null };
    });
    return { name:cached.name, prompt:cached.prompt, overviewLevels:null, byLevel:{[level]:subtopics}, activeLevel:level };
  }

  async function resumeTopic(topic){
    setHomeError(null);setHierarchy(null);setPlanData(null);
    setSubtopicIdx(null);setSubsubIdx(null);
    setNodeId(null);setNodeData(null);setLevelCheck(null);setSubtopicOverview(null);
    setCurrentTopic(topic);

    let cached=await loadJSON(`plan:${topic.id}`,null);
    if(!cached){
      // not migrated yet — check the old storage key before assuming this topic has nothing generated
      const legacy = await loadJSON(`hierarchy:${topic.id}`,null);
      if(legacy){
        cached = migrateLegacyHierarchy(legacy);
        await saveJSON(`plan:${topic.id}`, cached); // persist migrated shape so this only happens once
      }
    }
    if(cached){
      setPlanData(cached);
      setHierarchy(cached.byLevel[cached.activeLevel]);
      if(topic.isSingleSubtopic) setSubtopicIdx(0); // these topics have exactly one subtopic — never show the picker
      return;
    }

    // truly nothing cached anywhere — go through the overview/level-choice flow (same as a new topic)
    setLoadingH(true);
    try{
      const levels=await genOverviewLevels(topic.prompt||topic.name);
      setLoadingH(false);
      setTopicOverview({loading:false, levels, prompt:topic.prompt||topic.name, name:topic.name, id:topic.id, newTopic:null, learningProfile:null, resumingExisting:true});
    }catch(e){setLoadingH(false);setHomeError(`Грешка: ${e.message}`);}
  }

  // T.2: soft delete
  async function softDeleteTopic(topicId){
    const next=topics.map(t=>t.id===topicId?{...t,deletedAt:Date.now()}:t);
    setTopics(next);await saveJSON("topics",next);
    if(currentTopic?.id===topicId)goHome();
  }

  // T.2: restore from trash
  async function restoreTopic(topicId){
    const next=topics.map(t=>t.id===topicId?{...t,deletedAt:undefined}:t);
    setTopics(next);await saveJSON("topics",next);
  }

  async function pickSubtopic(i){
    setLevelCheck(null);
    setSubtopicIdx(i);
    const sub = hierarchy[i];
    const topicLevel = planData?.activeLevel;

    // if content for the plan's level already exists (generated before), just make sure it's active and go straight in
    if(sub.byLevel && sub.byLevel[topicLevel] && sub.byLevel[topicLevel].length){
      if(sub.activeLevel !== topicLevel){
        const updatedSub = {...sub, activeLevel:topicLevel};
        const updatedHierarchy = hierarchy.map((s,idx)=>idx===i?updatedSub:s);
        setHierarchy(updatedHierarchy);
        const updatedPlan = {...planData, byLevel:{...planData.byLevel, [planData.activeLevel]:updatedHierarchy}};
        setPlanData(updatedPlan);
        await saveJSON(`plan:${currentTopic.id}`, updatedPlan);
      }
      setSubtopicOverview(null);
      return;
    }

    // subtopic already has SOME active content (e.g. a level chosen manually before) — keep showing that
    const existing = getSubsubList(sub);
    if(existing && existing.length){
      setSubtopicOverview(null);
      return;
    }

    // nothing generated yet for this subtopic — auto-apply the plan's chosen level directly, no manual picker screen
    setSubtopicOverview(null);
    setLoadingH(true);
    try{
      const updPrefs={...prefs, abstraction:{...prefs.abstraction,[topicLevel]:(prefs.abstraction?.[topicLevel]||0)+1}};
      setPrefs(updPrefs); await saveJSON("prefs",updPrefs);

      const levelMeta = LEVELS.find(l=>l.level===topicLevel);
      const rawSubsubtopics = await genSubsubtopicsFor(currentTopic.prompt||currentTopic.name, sub.name, levelMeta);
      const overviewItem = { name:"Общ преглед", isOverview:true };
      const examplesItem = { name:"Практически примери", isExamples:true };
      const resourcesItem = { name:"Ресурси", isResources:true };
      const actionPlanItem = { name:"Rework", isActionPlan:true };
      const socraticItem = { name:"Сократически диалог", isSocratic:true };
      const testItem = { name:"Тест", isTest:true };
      const shoppingItem = { name:"Шопинг лист", isShopping:true };
      const nextItem = { name:"Приложение", isNext:true };
      const confessionItem = { name:"Признание на AI", isConfession:true };
      const humorItem = { name:"Хумор", isHumor:true };
      const simulationItem = { name:"Симулация", isSimulation:true };
      const gamesItem = { name:"Игри", isGames:true };
      const prefaceItem = { name:"Предговор", isPreface:true };
      const glossaryItem = { name:"Речник", isGlossary:true, terms:rawSubsubtopics };
      const encyclopediaItem = { name:"Енциклопедия", isEncyclopedia:true };
      const quotesItem = { name:"Цитати", isQuotes:true };
      const bibleItem = { name:"Learn from Bible", isBible:true };
      const subsubtopics = [prefaceItem, glossaryItem, overviewItem, examplesItem, resourcesItem, encyclopediaItem, quotesItem, bibleItem, socraticItem, confessionItem, humorItem, actionPlanItem, simulationItem, gamesItem, testItem, shoppingItem, nextItem];
      const updatedSub = {...sub, byLevel:{...sub.byLevel, [topicLevel]:subsubtopics}, activeLevel:topicLevel};
      const updatedHierarchy = hierarchy.map((s,idx)=> idx===i ? updatedSub : s);
      setHierarchy(updatedHierarchy);
      const updatedPlan = {...planData, byLevel:{...planData.byLevel, [planData.activeLevel]:updatedHierarchy}};
      setPlanData(updatedPlan);
      await saveJSON(`plan:${currentTopic.id}`, updatedPlan);
    }catch(e){
      setHomeError(`Грешка: ${e.message}`);
    }finally{
      setLoadingH(false);
    }
  }

  // reopen the subtopic-level picker to revisit or switch levels for this subtopic, reusing cached overview texts
  function openSubtopicLevelPicker(i){
    const sub = hierarchy[i];
    setSubtopicIdx(i);
    if(sub?.overviewLevels && sub.overviewLevels.length){
      setSubtopicOverview({subIdx:i, loading:false, levels:sub.overviewLevels, error:null, confirming:false});
      return;
    }
    // legacy subtopic without cached overview texts — generate once, then cache
    setSubtopicOverview({subIdx:i, loading:true, levels:[], error:null, confirming:false});
    (async()=>{
      try{
        const levels = await genOverviewLevels(`${currentTopic.prompt||currentTopic.name} — ${sub.name}`);
        const updatedHierarchy = hierarchy.map((s,idx)=> idx===i ? {...s, overviewLevels:levels} : s);
        setHierarchy(updatedHierarchy);
        const updatedPlan = {...planData, byLevel:{...planData.byLevel, [planData.activeLevel]:updatedHierarchy}};
        setPlanData(updatedPlan);
        await saveJSON(`plan:${currentTopic.id}`, updatedPlan);
        setSubtopicOverview({subIdx:i, loading:false, levels, error:null, confirming:false});
      }catch(e){
        setSubtopicOverview({subIdx:i, loading:false, levels:[], error:`Грешка: ${e.message}`, confirming:false});
      }
    })();
  }

  async function confirmSubtopicLevel(level){
    if(!subtopicOverview) return;
    const {subIdx} = subtopicOverview;
    const sub = hierarchy[subIdx];

    const updPrefs={...prefs, abstraction:{...prefs.abstraction,[level]:(prefs.abstraction?.[level]||0)+1}};
    setPrefs(updPrefs); await saveJSON("prefs",updPrefs);

    if(sub.byLevel && sub.byLevel[level] && sub.byLevel[level].length){
      // already generated for this level — just switch, no regeneration
      const updatedSub = {...sub, activeLevel:level};
      const updatedHierarchy = hierarchy.map((s,idx)=>idx===subIdx?updatedSub:s);
      setHierarchy(updatedHierarchy);
      const updatedPlan = {...planData, byLevel:{...planData.byLevel, [planData.activeLevel]:updatedHierarchy}};
      setPlanData(updatedPlan);
      await saveJSON(`plan:${currentTopic.id}`, updatedPlan);
      setSubtopicOverview(null);
      return;
    }

    setSubtopicOverview(prev=>({...prev, confirming:true, error:null}));
    try{
      const levelMeta = LEVELS.find(l=>l.level===level);
      const rawSubsubtopics = await genSubsubtopicsFor(currentTopic.prompt||currentTopic.name, sub.name, levelMeta);
      const overviewItem = { name:"Общ преглед", isOverview:true };
      const examplesItem = { name:"Практически примери", isExamples:true };
      const resourcesItem = { name:"Ресурси", isResources:true };
      const actionPlanItem = { name:"Rework", isActionPlan:true };
      const socraticItem = { name:"Сократически диалог", isSocratic:true };
      const testItem = { name:"Тест", isTest:true };
      const shoppingItem = { name:"Шопинг лист", isShopping:true };
      const nextItem = { name:"Приложение", isNext:true };
      const confessionItem = { name:"Признание на AI", isConfession:true };
      const humorItem = { name:"Хумор", isHumor:true };
      const simulationItem = { name:"Симулация", isSimulation:true };
      const gamesItem = { name:"Игри", isGames:true };
      const prefaceItem = { name:"Предговор", isPreface:true };
      const glossaryItem = { name:"Речник", isGlossary:true, terms:rawSubsubtopics };
      const encyclopediaItem = { name:"Енциклопедия", isEncyclopedia:true };
      const quotesItem = { name:"Цитати", isQuotes:true };

  async function askCuriosityQuestion(questionText, parentId=null){
    const q = questionText.trim();
    if(!q || subtopicIdx==null || !currentTopic || !planData) return;
    const subItem = hierarchy[subtopicIdx];
    const newQ = { id: uid(), q, answer:"", answered:false, parentId };
    const updatedQuestions = [...(subItem.curiosityQuestions||[]), newQ];
    const updatedSub = {...subItem, curiosityQuestions:updatedQuestions};
    const updatedHierarchy = hierarchy.map((s,idx)=> idx===subtopicIdx ? updatedSub : s);
    setHierarchy(updatedHierarchy);
    const updatedPlan = {...planData, byLevel:{...planData.byLevel, [planData.activeLevel]:updatedHierarchy}};
    setPlanData(updatedPlan);
    await saveJSON(`plan:${currentTopic.id}`, updatedPlan);
  }

  async function generateCuriosityAnswers(subIdx){
    const subItem = hierarchy[subIdx];
    const qs = subItem.curiosityQuestions||[];
    const unansweredIdx = qs.map((q,i)=>q.answered?-1:i).filter(i=>i!==-1);
    if(!unansweredIdx.length) return;

    setLoadingL(true); setNodeError(null);
    try{
      const levelMeta = LEVELS.find(l=>l.level===subItem.activeLevel);
      const items = unansweredIdx.map(i=>{
        const q = qs[i];
        const parent = q.parentId ? qs.find(p=>p.id===q.parentId) : null;
        return parent ? { text:q.q, parentQ:parent.q, parentA:parent.answer } : { text:q.q };
      });
      const answers = await genCuriosityAnswersBatch(currentTopic.prompt||currentTopic.name, subItem.name, items, levelMeta);

      const updatedQs = qs.map((q,i)=>{
        const pos = unansweredIdx.indexOf(i);
        return pos===-1 ? q : {...q, answer:answers[pos]||"", answered:true};
      });
      const updatedSub = {...subItem, curiosityQuestions:updatedQs};
      const updatedHierarchy = hierarchy.map((s,idx)=> idx===subIdx ? updatedSub : s);
      setHierarchy(updatedHierarchy);
      setNodeData({questions:updatedQs});
      const updatedPlan = {...planData, byLevel:{...planData.byLevel, [planData.activeLevel]:updatedHierarchy}};
      setPlanData(updatedPlan);
      await saveJSON(`plan:${currentTopic.id}`, updatedPlan);
    }catch(e){setNodeError(`Грешка: ${e.message}`);}
    finally{setLoadingL(false);}
  }

  // T.5: generate adapted topic
  async function generateAllContentForSubtopic(subIdx){
    if(!currentTopic||!planData) return;
    setGenAll(true); setGenAllProgress(""); setGenAllError(null);
    const failures=[];
    try{
      let curHierarchy = hierarchy;
      let curPlan = planData;
      const topicPrompt = currentTopic.prompt||currentTopic.name;
      let subItem = curHierarchy[subIdx];
      let subsubList = getSubsubList(subItem);
      const subLevel = subItem.activeLevel;
      const subLevelMeta = LEVELS.find(l=>l.level===subLevel);

      if(!subsubList || !subsubList.length) return; // subtopic must already have a chosen level/units

      setGenAllProgress(`${subItem.name}…`);
      const allKeys = await loadJSON("allNodeKeys", []);
      let keysUpdated = [...allKeys];

      for(let ui=0; ui<subsubList.length; ui++){
        const item = subsubList[ui];
        if(isCuriousItem(item)) continue; // dynamic, only appears from user questions
        if(isSimulationItem(item)) continue; // skip in bulk gen — expensive, generate on-demand only for now
        const uName = subName(item);
        setGenAllProgress(`${subItem.name} — ${uName}`);
        const id = `${currentTopic.id}/${slugify(subItem.name)}/L${subLevel}/${slugify(uName)}`;

        // each unit gets its own try/catch — one failure must not abort the rest of the batch
        try{
          const existing = await loadJSON(`node:${id}`, null);

          if(isOverviewItem(item)){
            if(!existing?.essay){
              const essay = await genSubtopicEssay(topicPrompt, subItem.name, subLevelMeta);
              await saveJSON(`node:${id}`, {...(existing||{unitConfused:false}), essay, essayLevel:subLevel, tunedEssay:existing?.tunedEssay||false});
            }
          } else if(isExamplesItem(item)){
            if(!existing?.examples){
              const examples = await genSubtopicExamples(topicPrompt, subItem.name, subLevelMeta);
              await saveJSON(`node:${id}`, {...(existing||{unitConfused:false}), examples, examplesLevel:subLevel, tunedExamples:existing?.tunedExamples||false});
            }
          } else if(isResourcesItem(item)){
            if(!existing?.resources?.length){
              const resources = await genResources(topicPrompt, subItem.name, subLevelMeta);
              await saveJSON(`node:${id}`, {...(existing||{unitConfused:false}), resources, resourcesLevel:subLevel, tunedResources:existing?.tunedResources||false});
            }
          } else if(isShoppingItem(item)){
            if(!existing?.shopItems?.length){
              const {items,innovations} = await genShoppingList(topicPrompt, subItem.name, subLevelMeta);
              await saveJSON(`node:${id}`, {...(existing||{unitConfused:false}), shopItems:items, shopInnovations:innovations, shopLevel:subLevel, tunedShopping:existing?.tunedShopping||false});
            }
          } else if(isGamesItem(item)){
            if(!existing?.crosswordPuzzle){

            }

              await saveJSON(`node:${id}`, {...(existing||{unitConfused:false}), entries, encLevel:subLevel, tunedEnc:existing?.tunedEnc||false});
            }
